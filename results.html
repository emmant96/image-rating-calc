<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Training results</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      Babel.registerPreset('react-classic', {
        presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]],
      })
    </script>
    <style>
      #root:empty::after {
        content: 'Loading...';
        display: block;
        padding: 3rem;
        text-align: center;
        color: #64748b;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
    </style>
  </head>
  <body class="bg-slate-950">
    <div id="root"></div>

    <script type="text/babel" data-presets="react-classic">
      const { useEffect, useMemo, useState } = React

      /* ---8<--- META START
       * Mirrors the lessons in training.html. The result code stores per lesson
       * seconds positionally, so the order here must match the order there.
       * A test asserts the two files agree.
       */
      const LESSON_META = [
        { id: 'howtosee', title: 'How to See', questions: 2 },
        { id: 'quality', title: 'Visual Quality', questions: 2 },
        { id: 'realism', title: 'Realism and Artifacts', questions: 5 },
        { id: 'artifact', title: 'AI Artifact', questions: 1 },
        { id: 'severity', title: 'How to mark severity', questions: 2 },
        { id: 'r2i', title: 'Omni R2I Elo', questions: 2 },
      ]

      // Question ids and short labels, in the same order the result code stores
      // answers. A test asserts this matches training.html exactly.
      const QUESTION_META = [
        { id: 'hs1', short: 'Better note than looks good' },
        { id: 'hs2', short: 'Smooth blur fall-off' },
        { id: 'vq1', short: 'Colours past a real camera' },
        { id: 'vq2', short: 'Picnic boy, irregular fingers' },
        { id: 'ra1', short: 'Strongest anatomy flag' },
        { id: 'ra2', short: 'Fresh Bread garbled sign' },
        { id: 'ra3', short: 'Best justification for realism' },
        { id: 'ra4', short: 'Sci-Fi telltales' },
        { id: 'ra5', short: 'Comic and manga realism' },
        { id: 'ai1', short: 'Blurry background, shallow focus' },
        { id: 'sv1', short: 'Red umbrella, deformed hand' },
        { id: 'sv2', short: 'Three artifacts versus two' },
        { id: 'r2i1', short: 'Person ID, clothing and pose' },
        { id: 'r2i2', short: 'Two axes each, IF favours A' },
      ]

      /** Which lesson each question belongs to, derived from the counts above. */
      const QUESTION_LESSON = LESSON_META.flatMap((l, i) =>
        Array.from({ length: l.questions }, () => i)
      )

      /* ---8<--- META END */

      function decodeResult(raw) {
        const line = raw.trim()
        if (!line) return null
        if (!line.startsWith('HEDGE1.')) return { error: 'Not a result code', raw: line }
        try {
          let b64 = line.slice('HEDGE1.'.length).replace(/-/g, '+').replace(/_/g, '/')
          while (b64.length % 4) b64 += '='
          const obj = JSON.parse(decodeURIComponent(escape(atob(b64))))
          if (typeof obj.n !== 'string' || typeof obj.s !== 'number') {
            return { error: 'Code is missing a name or score', raw: line }
          }
          return obj
        } catch (err) {
          return { error: 'Could not read this code', raw: line }
        }
      }

      const fmt = (secs) => {
        const s = Math.max(0, Math.round(secs || 0))
        return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0')
      }

      /* ---8<--- IDENTITY START
       * One way fingerprint of a person's passphrase.
       *
       * This must stay byte identical to the copy in training.html. If the two
       * ever drift, every submission verifies as WRONG and it looks like the
       * whole team cheated, so a test compares them and fails the build.
       */
      function fingerprint(name, passphrase) {
        const input =
          String(name).trim().toLowerCase() + '|' + String(passphrase).trim().toLowerCase()
        let h1 = 0xdeadbeef
        let h2 = 0x41c6ce57
        for (let i = 0; i < input.length; i++) {
          const ch = input.charCodeAt(i)
          h1 = Math.imul(h1 ^ ch, 2654435761)
          h2 = Math.imul(h2 ^ ch, 1597334677)
        }
        h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909)
        h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909)
        return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36)
      }
      /* ---8<--- IDENTITY END */

      const TEAM = ['Deborah', 'Radical', 'Keji', 'Enny', 'Daniel', 'Mimo', 'Onaope']

      const cx = (...c) => c.filter(Boolean).join(' ')

      const LETTERS = ['A', 'B', 'C', 'D', 'E']

      const same = (a, b) =>
        Array.isArray(a) && Array.isArray(b) && a.length === b.length && a.every((v, i) => v === b[i])

      /**
       * Signals that a submission may not be the work of the person named.
       *
       * This does not prove anything on its own. Two people who studied together
       * can reach the same wrong answer honestly. It is a prompt to ask, not a
       * verdict.
       */
      function findFlags(rows) {
        const flags = []

        // Identical answers AND an identical retry pattern between two people.
        for (let i = 0; i < rows.length; i++) {
          for (let j = i + 1; j < rows.length; j++) {
            const a = rows[i]
            const b = rows[j]
            if (a.n === b.n) continue
            if (!same(a.a, b.a)) continue

            // Matching correct answers mean nothing: there is only one correct
            // set, so everyone who knows the material matches everyone else.
            // Matching WRONG answers are the signal, because there are many
            // ways to be wrong and picking the same one is not a coincidence.
            const sharedMistakes = (a.c || []).reduce(
              (n, correct, i) => (correct === 0 && (b.c || [])[i] === 0 ? n + 1 : n),
              0
            )
            if (sharedMistakes === 0) continue

            const retriesMatch = same(a.w, b.w)
            flags.push({
              kind: 'answers',
              names: [a.n, b.n],
              text:
                a.n + ' and ' + b.n + ' made the same ' + sharedMistakes +
                ' mistake' + (sharedMistakes === 1 ? '' : 's') +
                ' and gave identical answers throughout' +
                (retriesMatch ? ', with identical retry patterns.' : '.'),
            })
          }
        }

        return flags
      }

      /**
       * Turns the words typed above into the file the training page reads.
       *
       * Only fingerprints leave this panel. The words themselves never go into
       * the repository, are never published, and do not need to be sent to
       * anyone: this block is enough to make them work.
       */
      function KeyBlock({ keys }) {
        const [copied, setCopied] = useState(false)
        const filled = TEAM.filter((n) => (keys[n] || '').trim())

        const json = useMemo(() => {
          const out = {}
          filled.forEach((n) => {
            out[n] = fingerprint(n, keys[n])
          })
          return JSON.stringify(out, null, 2)
        }, [keys])

        if (!filled.length) {
          return (
            <p className="mt-4 text-xs leading-relaxed text-slate-500">
              Type a word next to each name. A block will appear here that you paste
              into keys.json to make those words live.
            </p>
          )
        }

        const copy = async () => {
          try {
            if (navigator.clipboard && window.isSecureContext) {
              await navigator.clipboard.writeText(json)
              setCopied(true)
              setTimeout(() => setCopied(false), 2500)
              return
            }
          } catch (err) {
            /* fall through to manual selection */
          }
          const ta = document.createElement('textarea')
          ta.value = json
          ta.style.position = 'fixed'
          ta.style.opacity = '0'
          document.body.appendChild(ta)
          ta.select()
          try {
            document.execCommand('copy')
            setCopied(true)
            setTimeout(() => setCopied(false), 2500)
          } catch (err) {
            /* leave it on screen to select by hand */
          }
          document.body.removeChild(ta)
        }

        return (
          <div className="mt-5 border-t border-slate-800 pt-4">
            <div className="flex flex-wrap items-center justify-between gap-3">
              <div>
                <h3 className="text-xs font-bold uppercase tracking-[0.18em] text-slate-400">
                  Paste this into keys.json
                </h3>
                <p className="mt-1 text-xs text-slate-500">
                  {filled.length} of {TEAM.length} set. These are fingerprints, not the
                  words, so this is safe to publish or send on.
                </p>
              </div>
              <button
                onClick={copy}
                className={cx(
                  'rounded-lg px-3 py-1.5 text-xs font-semibold transition',
                  copied ? 'bg-emerald-500 text-emerald-950' : 'bg-indigo-500 text-white hover:bg-indigo-400'
                )}
              >
                {copied ? 'Copied' : 'Copy block'}
              </button>
            </div>
            <pre className="mt-3 overflow-x-auto rounded-xl bg-slate-950/60 p-3 font-mono text-[11px] leading-relaxed text-slate-300">
{json}
            </pre>
            <p className="mt-2 text-xs leading-relaxed text-slate-500">
              Open keys.json in the repository, replace everything with this, and commit.
              The new words work about a minute later.
            </p>
          </div>
        )
      }

      function PersonDetail({ r }) {
        // A code from before retry tracking existed carries no w or c arrays.
        // Absent data must read as unknown, never as a clean first try.
        const hasRetries = Array.isArray(r.w)
        const retriedTotal = hasRetries ? r.w.reduce((a, b) => a + b, 0) : null
        const firstTime = hasRetries ? r.w.filter((n) => n === 0).length : null
        return (
          <tr className="border-t border-slate-800 bg-slate-950/60">
            <td colSpan={15} className="px-4 py-4">
              <div className="mb-3 flex flex-wrap gap-5 text-xs text-slate-400">
                <span>
                  Right first time:{' '}
                  <span className="font-semibold text-slate-200">
                    {hasRetries ? firstTime + ' of ' + QUESTION_META.length : 'not recorded'}
                  </span>
                </span>
                <span>
                  Wrong picks before settling:{' '}
                  <span className={cx('font-semibold', retriedTotal ? 'text-amber-300' : 'text-emerald-300')}>
                    {hasRetries ? retriedTotal : 'not recorded'}
                  </span>
                </span>
              </div>
              <div className="overflow-x-auto">
                <table className="w-full min-w-[560px] text-left text-xs">
                  <thead className="text-slate-500">
                    <tr>
                      <th className="py-2 pr-3">#</th>
                      <th className="py-2 pr-3">Lesson</th>
                      <th className="py-2 pr-3">Question</th>
                      <th className="py-2 pr-3">Picked</th>
                      <th className="py-2 pr-3">Correct</th>
                      <th className="py-2 pr-3">Result</th>
                      <th className="py-2 pr-3">Changed</th>
                    </tr>
                  </thead>
                  <tbody>
                    {QUESTION_META.map((q, i) => {
                      const correct = r.c ? r.c[i] === 1 : null
                      const wrong = hasRetries ? r.w[i] || 0 : null
                      const picked = (r.a || [])[i]
                      const right = (r.ci || [])[i]
                      return (
                        <tr key={q.id} className="border-t border-slate-800/70">
                          <td className="py-2 pr-3 text-slate-600">{i + 1}</td>
                          <td className="py-2 pr-3 text-slate-500">L{QUESTION_LESSON[i] + 1}</td>
                          <td className="py-2 pr-3 text-slate-300">{q.short}</td>
                          <td className="py-2 pr-3 font-mono text-slate-200">
                            {picked === undefined || picked < 0 ? '-' : LETTERS[picked]}
                          </td>
                          <td className="py-2 pr-3 font-mono text-emerald-400">
                            {right === undefined ? '?' : LETTERS[right]}
                          </td>
                          <td className="py-2 pr-3">
                            {correct === null ? (
                              <span className="text-slate-600">unknown</span>
                            ) : correct ? (
                              <span className="text-emerald-400">correct</span>
                            ) : (
                              <span className="text-rose-400">wrong</span>
                            )}
                          </td>
                          <td className="py-2 pr-3">
                            {wrong === null ? (
                              <span className="text-slate-600">unknown</span>
                            ) : wrong === 0 ? (
                              <span className="text-emerald-400">first try</span>
                            ) : (
                              <span className="text-amber-300">
                                {wrong} time{wrong === 1 ? '' : 's'}
                              </span>
                            )}
                          </td>
                        </tr>
                      )
                    })}
                  </tbody>
                </table>
              </div>
              {!hasRetries && (
                <p className="mt-3 text-xs text-slate-500">
                  This code came from an earlier version of the training, so per question
                  detail is not available for it.
                </p>
              )}
            </td>
          </tr>
        )
      }

      function App() {
        const [open, setOpen] = useState(null)
        const [live, setLive] = useState([])
        const [liveState, setLiveState] = useState('checking')

        // If a collector is configured, results arrive on their own and nobody
        // has to paste anything. Without one the page falls back to codes.
        useEffect(() => {
          let cancelled = false
          const load = async () => {
            try {
              const cfg = await fetch('./config.json', { cache: 'no-store' }).then((r) =>
                r.ok ? r.json() : null
              )
              if (!cfg || !cfg.endpoint) {
                if (!cancelled) setLiveState('none')
                return
              }
              const data = await fetch(cfg.endpoint, { cache: 'no-store' }).then((r) => r.json())
              if (cancelled) return
              setLive(Array.isArray(data) ? data : data.rows || [])
              setLiveState('ok')
            } catch (err) {
              if (!cancelled) setLiveState('failed')
            }
          }
          load()
          const timer = setInterval(load, 60000)
          return () => {
            cancelled = true
            clearInterval(timer)
          }
        }, [])
        const [showKeys, setShowKeys] = useState(false)
        // The passphrases live in this browser's storage only. They are never
        // written to a file and never published, which is what keeps them
        // useful: the training page cannot contain them, so nobody can read
        // them out of the page source.
        const [keys, setKeys] = useState(() => {
          try {
            return JSON.parse(localStorage.getItem('hedgehog.keys') || '{}')
          } catch (err) {
            return {}
          }
        })

        const saveKeys = (next) => {
          setKeys(next)
          try {
            localStorage.setItem('hedgehog.keys', JSON.stringify(next))
          } catch (err) {
            /* private browsing refuses storage; verification still works this session */
          }
        }

        /**
         * 'ok'    the fingerprint matches the passphrase you hold
         * 'bad'   it does not, so this was submitted without their passphrase
         * 'unset' you have not entered a passphrase for this person yet
         * 'none'  the code predates passphrases
         */
        const verdict = (r) => {
          if (!r.k) return 'none'
          const secret = keys[r.n]
          if (!secret || !secret.trim()) return 'unset'
          return fingerprint(r.n, secret) === r.k ? 'ok' : 'bad'
        }
        const [text, setText] = useState(() => {
          try {
            return localStorage.getItem('hedgehog.results') || ''
          } catch (err) {
            return ''
          }
        })

        const save = (v) => {
          setText(v)
          try {
            localStorage.setItem('hedgehog.results', v)
          } catch (err) {
            /* private browsing refuses storage; the table still works */
          }
        }

        const { rows, errors } = useMemo(() => {
          // Anything the collector delivered, plus anything pasted by hand.
          const rows = live.map((r) => ({ ...r, total: (r.secs || []).reduce((a, b) => a + b, 0) }))
          const errors = []
          text.split(/[\r\n]+/).forEach((line) => {
            const r = decodeResult(line)
            if (!r) return
            if (r.error) {
              errors.push(r)
              return
            }
            const total = (r.secs || []).reduce((a, b) => a + b, 0)
            rows.push({ ...r, total })
          })
          // Highest score first, then fastest among equal scores.
          rows.sort((a, b) => b.s - a.s || a.total - b.total)
          return { rows, errors }
        }, [text, live])

        const best = rows.length ? rows[0] : null
        const flags = useMemo(() => {
          const found = findFlags(rows)
          // A submission whose fingerprint does not match is the strongest
          // signal available, so it leads the list.
          rows.forEach((r) => {
            if (verdict(r) === 'bad') {
              found.unshift({
                kind: 'passphrase',
                names: [r.n],
                text:
                  r.n + '\u2019s submission does not match the passphrase you hold for them.',
              })
            }
          })
          return found
        }, [rows, keys])
        const flaggedNames = useMemo(() => {
          const set = new Set()
          flags.forEach((f) => f.names.forEach((n) => set.add(n)))
          return set
        }, [flags])

        // Best attempt per person, so a retake does not crowd the leaderboard.
        const perPerson = useMemo(() => {
          const map = new Map()
          rows.forEach((r) => {
            const prev = map.get(r.n)
            if (!prev || r.s > prev.s || (r.s === prev.s && r.total < prev.total)) map.set(r.n, r)
          })
          return [...map.values()].sort((a, b) => b.s - a.s || a.total - b.total)
        }, [rows])

        const avgPerLesson = useMemo(() => {
          if (!rows.length) return null
          return LESSON_META.map((_, i) => {
            const vals = rows.map((r) => (r.secs || [])[i] || 0)
            return vals.reduce((a, b) => a + b, 0) / vals.length
          })
        }, [rows])

        return (
          <div className="min-h-screen bg-slate-950 text-slate-200 antialiased">
            <div className="mx-auto max-w-6xl px-4 py-8 sm:px-6 sm:py-12">
              <header className="mb-8 flex flex-wrap items-center justify-between gap-4">
                <div>
                  <h1 className="text-2xl font-bold text-slate-50">Training results</h1>
                  <p className="mt-1 text-sm text-slate-500">
                    Paste the codes your team sends you, one per line.
                  </p>
                </div>
                <div className="flex gap-2">
                  <a href="./training.html" className="rounded-xl border border-slate-700 px-4 py-2 text-sm text-slate-300 transition hover:border-slate-500 hover:text-slate-100">Training</a>
                  <a href="./index.html" className="rounded-xl border border-slate-700 px-4 py-2 text-sm text-slate-300 transition hover:border-slate-500 hover:text-slate-100">Calculator</a>
                </div>
              </header>

              <div className="mb-3 flex flex-wrap items-center gap-3 text-xs">
                <span
                  className={cx(
                    'rounded-lg px-2.5 py-1 font-semibold',
                    liveState === 'ok'
                      ? 'bg-emerald-500/15 text-emerald-300'
                      : liveState === 'failed'
                        ? 'bg-rose-500/15 text-rose-300'
                        : 'bg-slate-800 text-slate-400'
                  )}
                >
                  {liveState === 'ok'
                    ? 'Collector connected, ' + live.length + ' result(s) received'
                    : liveState === 'failed'
                      ? 'Collector configured but unreachable'
                      : liveState === 'none'
                        ? 'No collector set up, paste codes below'
                        : 'Checking for a collector...'}
                </span>
              </div>

              <textarea
                value={text}
                onChange={(e) => save(e.target.value)}
                spellCheck={false}
                placeholder={'HEDGE1.eyJ2IjoxLCJuIjoiRGVib3JhaCIsInMiOjEyLCJ0IjoxNSwuLi59\nHEDGE1....'}
                className="h-36 w-full rounded-2xl border border-slate-800 bg-slate-900/60 p-4 font-mono text-xs text-slate-300 outline-none transition focus:border-indigo-500"
              />
              <div className="mt-2 flex flex-wrap items-center justify-between gap-3 text-xs text-slate-500">
                <span>
                  {rows.length} result{rows.length === 1 ? '' : 's'} read
                  {errors.length > 0 && (
                    <span className="text-amber-400"> &middot; {errors.length} line(s) not understood</span>
                  )}
                </span>
                <button
                  onClick={() => save('')}
                  className="rounded-lg border border-slate-800 px-3 py-1.5 text-slate-400 transition hover:border-slate-600 hover:text-slate-200"
                >
                  Clear
                </button>
              </div>

              {best && (
                <div className="mt-6 rounded-2xl border border-emerald-400/40 bg-emerald-500/10 p-6">
                  <div className="text-xs font-bold uppercase tracking-[0.18em] text-slate-400">
                    Top score
                  </div>
                  <div className="mt-3 flex flex-wrap items-baseline gap-4">
                    <span className="text-3xl font-bold text-emerald-300">{best.n}</span>
                    <span className="rounded-lg bg-emerald-500 px-3 py-1 text-lg font-bold text-emerald-950">
                      {best.s} / {best.t}
                    </span>
                    <span className="text-sm text-slate-400">
                      {Math.round((best.s / best.t) * 100)}% in {fmt(best.total)}
                    </span>
                  </div>
                </div>
              )}

              <div className="mt-6 rounded-2xl border border-slate-800 bg-slate-900/60 p-5">
                <div className="flex flex-wrap items-center justify-between gap-3">
                  <div>
                    <h2 className="text-xs font-bold uppercase tracking-[0.18em] text-slate-400">
                      Passphrases
                    </h2>
                    <p className="mt-1 text-xs text-slate-500">
                      Type the words you handed out. Stored in this browser only.
                    </p>
                  </div>
                  <button
                    onClick={() => setShowKeys((v) => !v)}
                    className="rounded-lg border border-slate-700 px-3 py-1.5 text-xs text-slate-300 transition hover:border-slate-500 hover:text-slate-100"
                  >
                    {showKeys ? 'Hide' : 'Show'}
                  </button>
                </div>
                {showKeys && (
                  <>
                  <div className="mt-4 grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
                    {TEAM.map((n) => (
                      <label key={n} className="block">
                        <span className="text-xs font-semibold text-slate-300">{n}</span>
                        <input
                          type="text"
                          value={keys[n] || ''}
                          onChange={(e) => saveKeys({ ...keys, [n]: e.target.value })}
                          placeholder="their passphrase"
                          autoComplete="off"
                          className="mt-1 w-full rounded-lg border border-slate-800 bg-slate-950/60 px-3 py-2 text-sm text-slate-200 outline-none transition focus:border-indigo-500"
                        />
                      </label>
                    ))}
                  </div>

                  <KeyBlock keys={keys} />
                  </>
                )}
              </div>

              {flags.length > 0 && (
                <div className="mt-6 rounded-2xl border border-amber-400/50 bg-amber-500/10 p-5">
                  <div className="text-sm font-semibold text-amber-300">
                    Worth checking ({flags.length})
                  </div>
                  <ul className="mt-3 space-y-2">
                    {flags.map((f, i) => (
                      <li key={i} className="text-sm text-amber-100">
                        {f.text}
                      </li>
                    ))}
                  </ul>
                  <p className="mt-3 text-xs leading-relaxed text-amber-200/80">
                    These are prompts to ask, not proof. Two people sharing one laptop
                    trip the browser check honestly, and a browser identifies a machine
                    rather than a person.
                  </p>
                </div>
              )}

              {perPerson.length > 0 && (
                <h2 className="mt-8 text-lg font-semibold text-slate-100">Leaderboard</h2>
              )}
              {perPerson.length > 0 && (
                <div className="mt-3 overflow-x-auto rounded-2xl border border-slate-800">
                  <table className="w-full min-w-[720px] text-left text-sm">
                    <thead className="bg-slate-900/80 text-xs uppercase tracking-wider text-slate-500">
                      <tr>
                        <th className="px-4 py-3">#</th>
                        <th className="px-4 py-3">Name</th>
                        <th className="px-4 py-3">Passphrase</th>
                        <th className="px-4 py-3">Score</th>
                        <th className="px-4 py-3">%</th>
                        <th className="px-4 py-3">Total time</th>
                        <th
                          className="px-3 py-3 text-center"
                          title="Wrong options picked before settling on a final answer"
                        >
                          Retries
                        </th>
                        {LESSON_META.map((l, i) => (
                          <th key={l.id} className="px-3 py-3 text-center" title={l.title}>
                            L{i + 1}
                          </th>
                        ))}
                        <th className="px-4 py-3">Taken</th>
                        <th className="px-3 py-3"></th>
                      </tr>
                    </thead>
                    <tbody>
                      {perPerson.map((r, i) => {
                        const pct = Math.round((r.s / r.t) * 100)
                        const isOpen = open === r.n
                        return (
                          <React.Fragment key={r.n + r.d}>
                          <tr
                            onClick={() => setOpen(isOpen ? null : r.n)}
                            className={cx(
                              'cursor-pointer border-t border-slate-800 transition hover:bg-slate-800/40',
                              i === 0 ? 'bg-emerald-500/5' : 'odd:bg-slate-900/40'
                            )}
                          >
                            <td className="px-4 py-3 text-slate-500">{i + 1}</td>
                            <td className="px-4 py-3 font-semibold text-slate-100">
                              {r.n}
                              {flaggedNames.has(r.n) && (
                                <span
                                  title="See the checks listed above"
                                  className="ml-2 rounded bg-amber-500/20 px-1.5 py-0.5 text-[10px] font-bold uppercase tracking-wider text-amber-300"
                                >
                                  check
                                </span>
                              )}
                            </td>
                            <td className="px-4 py-3">
                              {(() => {
                                const v = verdict(r)
                                if (v === 'ok') return <span className="text-xs font-semibold text-emerald-400">verified</span>
                                if (v === 'bad') return <span className="text-xs font-bold text-rose-400">WRONG</span>
                                if (v === 'unset') return <span className="text-xs text-slate-500">not set</span>
                                return <span className="text-xs text-slate-600">n/a</span>
                              })()}
                            </td>
                            <td className="px-4 py-3 text-slate-200">
                              {r.s} / {r.t}
                            </td>
                            <td
                              className={cx(
                                'px-4 py-3 font-semibold',
                                pct >= 80 ? 'text-emerald-400' : pct >= 60 ? 'text-amber-400' : 'text-rose-400'
                              )}
                            >
                              {pct}%
                            </td>
                            <td className="px-4 py-3 text-slate-300">{fmt(r.total)}</td>
                            <td className="px-3 py-3 text-center">
                              <span
                                className={cx(
                                  'font-semibold',
                                  ((r.w || []).reduce((a, b) => a + b, 0) > 0) ? 'text-amber-300' : 'text-emerald-400'
                                )}
                              >
                                {r.w ? (r.w || []).reduce((a, b) => a + b, 0) : '-'}
                              </span>
                            </td>
                            {LESSON_META.map((l, j) => (
                              <td key={l.id} className="px-3 py-3 text-center text-xs text-slate-400">
                                {fmt((r.secs || [])[j])}
                              </td>
                            ))}
                            <td className="px-4 py-3 text-xs text-slate-500">
                              {(r.d || '').replace('T', ' ')}
                            </td>
                            <td className="px-3 py-3 text-xs font-semibold text-indigo-400">
                              {isOpen ? 'hide' : 'view'}
                            </td>
                          </tr>
                          {isOpen && <PersonDetail r={r} />}
                          </React.Fragment>
                        )
                      })}
                    </tbody>
                    {avgPerLesson && (
                      <tfoot>
                        <tr className="border-t border-slate-700 bg-slate-900/70 text-xs text-slate-400">
                          <td className="px-4 py-3" colSpan={7}>
                            Average time per lesson
                          </td>
                          {avgPerLesson.map((s, i) => (
                            <td key={i} className="px-3 py-3 text-center">
                              {fmt(s)}
                            </td>
                          ))}
                          <td />
                          <td />
                        </tr>
                      </tfoot>
                    )}
                  </table>
                </div>
              )}

              {perPerson.length > 0 && (
                <p className="mt-3 text-xs leading-relaxed text-slate-500">
                  L1 to L5 are the lessons in order: {LESSON_META.map((l) => l.title).join(', ')}.
                  Only each person's best attempt is listed. Where scores tie, the faster time ranks higher.
                </p>
              )}

              {errors.length > 0 && (
                <div className="mt-6 rounded-2xl border border-amber-400/40 bg-amber-500/10 p-4">
                  <div className="text-sm font-semibold text-amber-300">
                    {errors.length} line(s) could not be read
                  </div>
                  <ul className="mt-2 space-y-1">
                    {errors.slice(0, 5).map((e, i) => (
                      <li key={i} className="break-all font-mono text-xs text-slate-400">
                        {e.error}: {e.raw.slice(0, 60)}
                        {e.raw.length > 60 ? '...' : ''}
                      </li>
                    ))}
                  </ul>
                </div>
              )}

              {rows.length === 0 && errors.length === 0 && (
                <div className="mt-8 rounded-2xl border border-slate-800 bg-slate-900/40 p-8 text-center">
                  <p className="text-sm text-slate-400">
                    Nothing pasted yet. When someone finishes the training they get a code
                    starting with HEDGE1. Paste them here, one per line.
                  </p>
                </div>
              )}
            </div>
          </div>
        )
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />)
    </script>
  </body>
</html>
