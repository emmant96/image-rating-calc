              options: [

      const ALL_QUESTIONS = LESSONS.flatMap((l) => l.questions)

      /**
       * How many wrong options a person selected before settling on the correct
       * one. Nothing on screen reveals correctness while they answer, so this
       * measures genuine reconsideration rather than guess and check.
       */
      function wrongTries(q, checks) {
        const seq = (checks && checks[q.id]) || []
        const firstRight = seq.indexOf(q.answer)
        return firstRight === -1 ? seq.length : firstRight
      }

      function scoreAnswers(answers) {
        let correct = 0
        ALL_QUESTIONS.forEach((q) => {
          if (answers[q.id] === q.answer) correct++
        })
        return correct
      }

      /** Suggested reading time, derived from each lesson's own length. */
      function estimateMinutes(lesson) {
        const words = lesson.blocks.reduce((n, b) => {
          if (b.k === 'img') return n + 12
          if (b.k === 'table') return n + b.t.flat().join(' ').split(/\s+/).length
          const text = Array.isArray(b.t) ? b.t.join(' ') : b.t
          return n + text.trim().split(/\s+/).length
        }, 0)
        const qWords = lesson.questions.reduce(
          (n, q) => n + (q.q + ' ' + q.options.join(' ')).trim().split(/\s+/).length,
          0
        )
        return Math.max(1, Math.round(words / 200 + qWords / 90))
      }

      /* ---8<--- COURSE END */

      /* ---8<--- IDENTITY START
       * One way fingerprint of a person's passphrase.
       *
       * The page holds no list of valid passphrases, so nothing secret ships in
       * the source. It mixes what the person types with their name and sends
       * only the fingerprint. The lead holds the real passphrases and checks
       * them in the dashboard, where they live in that browser's storage rather
       * than in any file.
       *
       * To submit as Daniel you would need Daniel's passphrase, and the
       * published source gives you nothing to guess against. What this cannot
       * stop is Daniel telling someone else what his passphrase is.
       */
      function fingerprint(name, passphrase) {
        const input =
          String(name).trim().toLowerCase() + '|' + String(passphrase).trim().toLowerCase()
        let h1 = 0xdeadbeef
        let h2 = 0x41c6ce57
        for (let i = 0; i < input.length; i++) {
          const ch = input.charCodeAt(i)
          h1 = Math.imul(h1 ^ ch, 2654435761)
          h2 = Math.imul(h2 ^ ch, 1597334677)
        }
        h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909)
        h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909)
        return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36)
      }
      /* ---8<--- IDENTITY END */

      /**
       * One attempt each, remembered in this browser.
       *
       * This is a lock on the door, not a wall: another browser, a phone, or
       * clearing site data all get a fresh attempt. Only a server can truly
       * enforce it, so the dashboard also shows the lead every submission it
       * receives, and a second one from the same person is visible there.
       */
      function attemptKey(name) {
        return 'hedgehog.done.' + String(name).trim().toLowerCase()
      }

      function loadAttempt(name) {
        try {
          const raw = localStorage.getItem(attemptKey(name))
          return raw ? JSON.parse(raw) : null
        } catch (err) {
          return null
        }
      }

      function saveAttempt(name, record) {
        try {
          localStorage.setItem(attemptKey(name), JSON.stringify(record))
        } catch (err) {
          /* private browsing refuses storage; the attempt simply is not remembered */
        }
      }

      /**
       * Send the result to the lead's collector if one is configured.
       * With no endpoint the page still works: the person copies their code.
       */
      async function sendResult(endpoint, payload) {
        if (!endpoint) return 'no-endpoint'
        try {
          await fetch(endpoint, {
            method: 'POST',
            // A simple content type keeps this a non preflighted request, which
            // Google Apps Script accepts without any CORS configuration.
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload),
          })
          return 'sent'
        } catch (err) {
          return 'failed'
        }
      }

      function encodeResult(payload) {
        const json = JSON.stringify(payload)
        const b64 = btoa(unescape(encodeURIComponent(json)))
        return 'HEDGE1.' + b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')
      }

      /* ================================================================ */

      const cx = (...c) => c.filter(Boolean).join(' ')

      const LETTERS = ['A', 'B', 'C', 'D', 'E']

      const fmt = (secs) => {
        const s = Math.max(0, Math.round(secs))
        return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0')
      }

      /** An image slot that degrades to a labelled placeholder when the file is absent. */
      function Figure({ file, caption }) {
        const [failed, setFailed] = useState(false)
        return (
          <figure className="mt-5">

      function Block({ block }) {
        if (block.k === 'img') return <Figure file={block.file} caption={block.caption} />
        if (block.k === 'h')
          return <h3 className="mt-7 text-lg font-semibold text-neutral-900">{block.t}</h3>
        if (block.k === 'p')

        if (block.k === 'table')

                            'px-3 py-2.5 align-top',
                            i === 0 ? 'text-xs font-bold uppercase tracking-wider text-neutral-600' : 'text-neutral-700',
                            i > 0 && j === 0 ? 'text-rose-700' : '',
                            i > 0 && j === 1 ? 'text-emerald-700' : ''
                          )}
                        >
                          {cell}
                        </td>
                      ))}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )
        if (block.k === 'list')
          return (
            <ul className="mt-3 space-y-2">
              {block.t.map((item, i) => (

                  <span>{item}</span>
                </li>
              ))}
            </ul>
          )
        return (
          <div className="mt-5 rounded-xl border-l-4 border-indigo-500 bg-indigo-50 p-4 text-[15px] leading-relaxed text-neutral-800">

      }

      function Question({ q, index, value, onChange }) {
        return (
          <div className="mt-5 rounded-2xl border border-neutral-300 bg-white p-5">
            <div className="flex items-center gap-2">
              <span className="text-xs font-bold uppercase tracking-[0.18em] text-neutral-500">
                Question {index + 1}
              </span>
              {q.extra && (
                <span className="rounded bg-neutral-200 px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wider text-neutral-600">
                  extra practice
                </span>
              )}
            </div>
            <p className="mt-3 text-[15px] font-medium leading-relaxed text-neutral-900">{q.q}</p>

            <div role="radiogroup" className="mt-4 space-y-2">
              {q.options.map((opt, i) => {
                const active = value === i
                return (
                  <button
                    key={i}
                    role="radio"
                    aria-checked={active}
                    onClick={() => onChange(q.id, i)}
                    className={cx(
                      'flex w-full items-start gap-3 rounded-xl px-4 py-3 text-left text-sm transition focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400',
                      active
                        ? 'bg-indigo-500 text-white'
                        : 'bg-neutral-100 text-neutral-700 hover:bg-neutral-200'
                    )}
                  >
                    <span
                      className={cx(
                        'mt-0.5 flex h-4 w-4 shrink-0 items-center justify-center rounded-full border',
                        active ? 'border-current' : 'border-neutral-400'
                      )}
                    >
                      {active && <span className="h-2 w-2 rounded-full bg-current" />}
                    </span>
                    <span>{LETTERS[i]}. {opt}</span>
                  </button>
                )
              })}
            </div>
          </div>
        )
      }

      function Start({ onStart }) {
        const [name, setName] = useState('')
        const [pass, setPass] = useState('')
        const [error, setError] = useState('')
        // Fingerprints of the passphrases, never the passphrases themselves.
        const [keys, setKeys] = useState(undefined)
        const mins = LESSONS.reduce((n, l) => n + estimateMinutes(l), 0)

        useEffect(() => {
          fetch('./keys.json', { cache: 'no-store' })
            .then((r) => (r.ok ? r.json() : null))
            .then((k) => setKeys(k))
            .catch(() => setKeys(null))
        }, [])

        const previous = name ? loadAttempt(name) : null

        const submit = () => {
          setError('')
          if (!name) return setError('Pick your name first.')
          if (!pass.trim()) return setError('Enter your passphrase.')

          if (keys && keys[name]) {
            if (fingerprint(name, pass) !== keys[name]) {
              return setError('That passphrase is not right for ' + name + '.')
            }
          }
          // keys missing or no entry for this person: the passphrase still
          // travels as a fingerprint, so the lead can verify it afterwards.
          onStart(name, pass)
        }

        return (
          <div className="mx-auto max-w-2xl">
            <h1 className="text-3xl font-bold text-neutral-900">Image rating training</h1>
            <p className="mt-3 text-[15px] leading-relaxed text-neutral-600">
              Six lessons, each ending in questions. On the last page you submit and
              see your score. You get one attempt, so read carefully before you answer.
            </p>
            <div className="mt-6 grid grid-cols-3 gap-3">
              {[
                ['Lessons', LESSONS.length],
                ['Questions', ALL_QUESTIONS.length],
                ['Suggested', '~' + mins + ' min'],
              ].map(([k, v]) => (
                <div key={k} className="rounded-2xl border border-neutral-300 bg-white p-4 text-center">
                  <div className="text-xs uppercase tracking-wider text-neutral-500">{k}</div>
                  <div className="mt-1 text-xl font-semibold text-neutral-900">{v}</div>
                </div>
              ))}
            </div>

            <div className="mt-8 rounded-2xl border border-neutral-300 bg-white p-6">
              <label className="text-sm font-semibold text-neutral-800">Who is taking this?</label>
              <div className="mt-3 grid grid-cols-2 gap-2 sm:grid-cols-4">
                {TEAM.map((n) => (
                  <button
                    key={n}
                    onClick={() => {
                      setName(n)
                      setError('')
                    }}
                    className={cx(
                      'rounded-xl px-3 py-2.5 text-sm font-semibold transition',
                      name === n
                        ? 'bg-indigo-500 text-white'
                        : 'bg-neutral-100 text-neutral-600 hover:bg-neutral-200 hover:text-neutral-900'
                    )}
                  >
                    {n}
                  </button>
                ))}
              </div>

              <label className="mt-6 block text-sm font-semibold text-neutral-800">
                Your passphrase
              </label>
              <input
                type="password"
                value={pass}
                onChange={(e) => {
                  setPass(e.target.value)
                  setError('')
                }}
                onKeyDown={(e) => e.key === 'Enter' && submit()}
                placeholder="the word your lead gave you"
                autoComplete="off"
                className="mt-2 w-full rounded-xl border border-neutral-300 bg-white px-4 py-2.5 text-sm text-neutral-800 outline-none transition focus:border-indigo-500"
              />

              {error && (
                <p className="mt-3 rounded-xl bg-rose-50 p-3 text-sm font-medium text-rose-700">
                  {error}
                </p>
              )}

              {previous && (
                <div className="mt-4 rounded-xl bg-amber-50 p-4">
                  <p className="text-sm font-semibold text-amber-800">
                    {name} has already completed this on this device.
                  </p>
                  <p className="mt-1 text-xs leading-relaxed text-amber-700">
                    Scored {previous.s} out of {previous.t}. One attempt each, so it
                    cannot be taken again here.
                  </p>
                </div>
              )}

              <button
                disabled={!!previous || keys === undefined}
                onClick={submit}
                className={cx(
                  'mt-5 w-full rounded-xl px-4 py-3 text-sm font-semibold transition',
                  previous || keys === undefined
                    ? 'cursor-not-allowed bg-neutral-200 text-neutral-400'
                    : 'bg-indigo-500 text-white hover:bg-indigo-400'
                )}
              >
                {keys === undefined
                  ? 'Loading...'
                  : previous
                    ? 'Already completed'
                    : 'Start'}
              </button>

              <p className="mt-3 text-xs leading-relaxed text-neutral-500">
                The suggested time is a guide, not a limit.
              </p>
            </div>
          </div>
        )
      }

      function Results({ name, pass, answers, checks, seconds, onRestart, sendState }) {
        const score = scoreAnswers(answers)
        const total = ALL_QUESTIONS.length
        const pct = Math.round((score / total) * 100)
        const [copied, setCopied] = useState(false)
        const codeRef = useRef(null)
        const totalSecs = Object.values(seconds).reduce((a, b) => a + b, 0)

        const code = useMemo(
          () =>
            encodeResult({
              v: 1,
              n: name,
              s: score,
              t: total,
              d: new Date().toISOString().slice(0, 16),
              secs: LESSONS.map((l) => Math.round(seconds[l.id] || 0)),
              a: ALL_QUESTIONS.map((q) => (answers[q.id] === undefined ? -1 : answers[q.id])),
              w: ALL_QUESTIONS.map((q) => wrongTries(q, checks)),
              c: ALL_QUESTIONS.map((q) => (answers[q.id] === q.answer ? 1 : 0)),
              k: fingerprint(name, pass),
              // The correct index per question, so the dashboard can show what was
              // picked against what was right without a second copy of the course.
              ci: ALL_QUESTIONS.map((q) => q.answer),
            }),
          [name, pass, score, total, seconds, answers, checks]
        )

        const copy = async () => {
          try {
            if (navigator.clipboard && window.isSecureContext) {
              await navigator.clipboard.writeText(code)
              setCopied(true)
              setTimeout(() => setCopied(false), 2500)
              return
            }
          } catch (err) {
            /* fall through */
          }
          const ta = document.createElement('textarea')
          ta.value = code
          ta.style.position = 'fixed'
          ta.style.opacity = '0'
          document.body.appendChild(ta)
          ta.select()
          let ok = false
          try {
            ok = document.execCommand('copy')
          } catch (err) {
            ok = false
          }
          document.body.removeChild(ta)
          if (ok) {
            setCopied(true)
            setTimeout(() => setCopied(false), 2500)
          } else if (codeRef.current) {
            const range = document.createRange()
            range.selectNodeContents(codeRef.current)
            const sel = window.getSelection()
            sel.removeAllRanges()
            sel.addRange(range)
          }
        }

        const tone = pct >= 80 ? 'emerald' : pct >= 60 ? 'amber' : 'rose'
        const card = {
          emerald: 'border-emerald-400 bg-emerald-50',
          amber: 'border-amber-400 bg-amber-50',
          rose: 'border-rose-400 bg-rose-50',
        }[tone]
        const chip = {
          emerald: 'bg-emerald-600 text-white',
          amber: 'bg-amber-500 text-white',
          rose: 'bg-rose-600 text-white',
        }[tone]

        return (
          <div className="mx-auto max-w-3xl">
            <div className={cx('rounded-2xl border p-6', card)}>
              <div className="text-xs font-bold uppercase tracking-[0.18em] text-neutral-600">
                Result for {name}
              </div>
              <div className="mt-3 flex flex-wrap items-center gap-4">
                <span className={cx('rounded-xl px-4 py-2 text-3xl font-bold', chip)}>
                  {score} / {total}
                </span>
                <span className="text-2xl font-semibold text-neutral-800">{pct}%</span>
                <span className="text-sm text-neutral-600">Total time {fmt(totalSecs)}</span>
              </div>
            </div>

            <div className="mt-4 rounded-2xl border border-neutral-300 bg-white p-5">
              {sendState === 'sent' ? (
                <div className="flex items-start gap-3">
                  <span className="mt-0.5 text-lg text-emerald-600">&#10003;</span>
                  <div>
                    <h2 className="text-sm font-semibold text-neutral-900">
                      Sent to your lead
                    </h2>
                    <p className="mt-1 text-xs leading-relaxed text-neutral-500">
                      Nothing else to do. Your result is already in their dashboard.
                    </p>
                  </div>
                </div>
              ) : (
                <>
                  <h2 className="text-xs font-bold uppercase tracking-[0.18em] text-neutral-600">
                    {sendState === 'failed' ? 'Could not send, copy this instead' : 'Send this to your lead'}
                  </h2>
                  <p
                    ref={codeRef}
                    className="mt-3 break-all rounded-xl bg-neutral-200 p-3 font-mono text-[11px] leading-relaxed text-neutral-600"
                  >
                    {code}
                  </p>
                  <button
                    onClick={copy}
                    className={cx(
                      'mt-3 w-full rounded-xl px-4 py-2.5 text-sm font-semibold transition',
                      copied ? 'bg-emerald-600 text-white' : 'bg-indigo-500 text-white hover:bg-indigo-400'
                    )}
                  >
                    {copied ? 'Copied' : 'Copy my result code'}
                  </button>
                </>
              )}
            </div>

            <h2 className="mt-8 text-lg font-semibold text-neutral-900">Where you spent your time</h2>
            <div className="mt-3 overflow-hidden rounded-2xl border border-neutral-300">
              {LESSONS.map((lesson, i) => {
                const missed = lesson.questions.filter((q) => answers[q.id] !== q.answer).length
                return (
                  <div
                    key={lesson.id}
                    className={cx(
                      'flex flex-wrap items-center justify-between gap-3 px-4 py-3',
                      i % 2 ? 'bg-neutral-50' : 'bg-white'
                    )}
                  >
                    <span className="text-sm font-medium text-neutral-800">{lesson.title}</span>
                    <span className="flex items-center gap-4 text-xs">
                      <span className="text-neutral-500">
                        {fmt(seconds[lesson.id] || 0)} of about {estimateMinutes(lesson)}:00
                      </span>
                      <span
                        className={cx(
                          'font-semibold',
                          missed === 0 ? 'text-emerald-700' : 'text-amber-700'
                        )}
                      >
                        {missed === 0
                          ? 'all correct'
                          : missed + ' to revisit'}
                      </span>
                    </span>
                  </div>
                )
              })}
            </div>
            <p className="mt-3 text-xs leading-relaxed text-neutral-500">
              Lessons marked to revisit are worth reading again. The answers are not
              shown here, so go back to the material rather than memorising a list.
            </p>

            <button
              onClick={onRestart}
              className="mt-8 w-full rounded-xl border border-neutral-400 px-4 py-3 text-sm font-medium text-neutral-700 transition hover:border-neutral-500 hover:text-neutral-900"
            >
              Start again
            </button>
          </div>
        )
      }

      function Shell({ children }) {
        return (
          <div className="min-h-screen bg-neutral-100 text-neutral-800 antialiased">
            <div className="mx-auto max-w-5xl px-4 py-8 sm:px-6 sm:py-12">
              <header className="mb-8 flex items-center justify-between gap-4">
                <div className="flex items-center gap-3">
                  <div className="flex h-10 w-10 items-center justify-center rounded-xl bg-indigo-100 text-lg">
                    &#128218;
                  </div>
                  <div>
                    <div className="text-sm font-semibold text-neutral-900">Rating training</div>
                    <div className="text-xs tracking-wide text-neutral-9000">Study and knowledge checks</div>
                  </div>
                </div>
                <a
                  href="./index.html"
                  className="rounded-xl border border-neutral-400 px-4 py-2 text-sm font-medium text-neutral-700 transition hover:border-neutral-500 hover:text-neutral-900"
                >
                  Calculator
                </a>
              </header>
              {children}
            </div>
          </div>
        )
      }

      function App() {
        const [name, setName] = useState(null)
        const [pass, setPass] = useState('')
        const [page, setPage] = useState(0)
        const [answers, setAnswers] = useState({})
        // Every option selected, in order, per question. The last entry is the
        // answer; anything before it is a change of mind.
        const [checks, setChecks] = useState({})
        const [seconds, setSeconds] = useState({})
        const [done, setDone] = useState(false)
        const [sendState, setSendState] = useState('pending')

        const enter = useRef(Date.now())
        const current = LESSONS[page]

        const bank = useCallback((lessonId) => {
          const now = Date.now()
          const delta = (now - enter.current) / 1000
          enter.current = now
          if (delta <= 0) return
          setSeconds((prev) => ({ ...prev, [lessonId]: (prev[lessonId] || 0) + delta }))
        }, [])

        useEffect(() => {
          const onVisibility = () => {
            if (document.hidden) bank(LESSONS[page].id)
            else enter.current = Date.now()
          }
          document.addEventListener('visibilitychange', onVisibility)
          return () => document.removeEventListener('visibilitychange', onVisibility)
        }, [page, bank])

        const submit = async () => {
          bank(current.id)
          const score = scoreAnswers(answers)
          // Remember the attempt before anything else, so a failed send cannot
          // hand someone a second try.
          saveAttempt(name, { s: score, t: ALL_QUESTIONS.length, d: new Date().toISOString() })
          setDone(true)
          window.scrollTo({ top: 0, behavior: 'smooth' })

          const endpoint = await fetch('./config.json', { cache: 'no-store' })
            .then((r) => (r.ok ? r.json() : null))
            .then((c) => (c && c.endpoint) || '')
            .catch(() => '')

          const secondsNow = { ...seconds }
          setSendState(await sendResult(endpoint, {
            v: 1,
            n: name,
            s: score,
            t: ALL_QUESTIONS.length,
            d: new Date().toISOString().slice(0, 16),
            secs: LESSONS.map((l) => Math.round(secondsNow[l.id] || 0)),
            a: ALL_QUESTIONS.map((q) => (answers[q.id] === undefined ? -1 : answers[q.id])),
            w: ALL_QUESTIONS.map((q) => wrongTries(q, checks)),
            c: ALL_QUESTIONS.map((q) => (answers[q.id] === q.answer ? 1 : 0)),
            k: fingerprint(name, pass),
            ci: ALL_QUESTIONS.map((q) => q.answer),
          }))
        }

        const go = (delta) => {
          bank(current.id)
          setPage((p) => Math.min(LESSONS.length - 1, Math.max(0, p + delta)))
          window.scrollTo({ top: 0, behavior: 'smooth' })
        }

        const pick = (id, value) => {
          setAnswers((prev) => ({ ...prev, [id]: value }))
          setChecks((prev) => {
            const seq = prev[id] || []
            // Clicking the same option again is not a change of mind.
            if (seq[seq.length - 1] === value) return prev
            return { ...prev, [id]: seq.concat(value) }
          })
        }

        const allAnswered = ALL_QUESTIONS.every((q) => answers[q.id] !== undefined)
        const answered = current ? current.questions.filter((q) => answers[q.id] !== undefined).length : 0
        const last = page === LESSONS.length - 1

        if (!name)
          return (
            <Shell>
              <Start
                onStart={(n, p) => {
                  setName(n)
                  setPass(p)
                  enter.current = Date.now()
                }}
              />
            </Shell>
          )

        if (done)
          return (
            <Shell>
              <Results
                name={name}
                pass={pass}
                answers={answers}
                checks={checks}
                seconds={seconds}
                sendState={sendState}
                onRestart={() => {
                  setName(null)
                  setPass('')
                  setPage(0)
                  setAnswers({})
                  setChecks({})
                  setSeconds({})
                  setDone(false)
                }}
              />
            </Shell>
          )

        return (
          <Shell>
            <div className="mx-auto max-w-3xl">
              <div className="flex flex-wrap items-center justify-between gap-3">
                <div className="flex gap-1.5">
                  {LESSONS.map((l, i) => (
                    <span
                      key={l.id}
                      className={cx(
                        'h-1.5 w-8 rounded-full transition',
                        i < page ? 'bg-indigo-400' : i === page ? 'bg-indigo-500' : 'bg-neutral-200'
                      )}
                    />
                  ))}
                </div>
                <span className="text-xs text-neutral-9000">
                  Page {page + 1} of {LESSONS.length} &middot; about {estimateMinutes(current)} min
                </span>
              </div>

              <h1 className="mt-6 text-2xl font-bold text-neutral-900 sm:text-3xl">{current.title}</h1>
              <p className="mt-2 text-sm text-neutral-600">{current.summary}</p>

              <article className="mt-6">
                {current.blocks.map((b, i) => (
                  <Block key={i} block={b} />
                ))}
              </article>

              <div className="mt-10 border-t border-neutral-300 pt-6">
                <div className="flex items-baseline justify-between">
                  <h2 className="text-lg font-semibold text-neutral-900">Questions</h2>
                  <span className="text-xs text-neutral-9000">
                    {answered} of {current.questions.length} answered
                  </span>
                </div>
                {current.questions.map((q, i) => (
                  <Question
                    key={q.id}
                    q={q}
                    index={i}
                    value={answers[q.id]}
                    onChange={pick}
                  />
                ))}
              </div>

              <div className="mt-8 flex items-center justify-between gap-3 border-t border-neutral-300 pt-6">
                <button
                  onClick={() => go(-1)}
                  disabled={page === 0}
                  className={cx(
                    'rounded-xl border px-5 py-2.5 text-sm font-medium transition',
                    page === 0
                      ? 'cursor-not-allowed border-neutral-200 text-neutral-400'
                      : 'border-neutral-400 text-neutral-700 hover:border-neutral-500 hover:text-neutral-900'
                  )}
                >
                  Previous
                </button>

                {last ? (
                  <button
                    onClick={submit}
                    disabled={!allAnswered}
                    className={cx(
                      'rounded-xl px-6 py-2.5 text-sm font-semibold transition',
                      allAnswered
                        ? 'bg-emerald-600 text-white hover:bg-emerald-400'
                        : 'cursor-not-allowed bg-neutral-200 text-neutral-400'
                    )}
                  >
                    {allAnswered ? 'Submit and see my score' : 'Answer every question first'}
                  </button>
                ) : (
                  <button
                    onClick={() => go(1)}
                    className="rounded-xl bg-indigo-500 px-6 py-2.5 text-sm font-semibold text-white transition hover:bg-indigo-400"
                  >
                    Next
                  </button>
                )}
              </div>

              {last && !allAnswered && (
                <p className="mt-3 text-right text-xs text-amber-700">
                  Some questions on earlier pages are still blank. Use Previous to finish them.
                </p>
              )}
            </div>
          </Shell>
        )
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />)
    </script>
  </body>
</html>
