    <script type="text/babel" data-presets="react-classic">

      /* ================================================================
       * COURSE

       *

      const TEAM = ['Deborah', 'Radical', 'Keji', 'Enny', 'Daniel', 'Mimo', 'Onaope']

      // Files live in ./assets. Missing files fall back to a labelled slot.
      const IMG = (file, caption) => ({ k: 'img', file, caption })

      const LESSONS = [
        {
          id: 'howtosee',
          title: 'How to See',
          summary: 'Consistent observation, not taste.',
          blocks: [
            { k: 'p', t: 'When you look at an image, you should start by looking at its composition, what is being shown and how. This means you pay attention to the objects and subjects, and how they are framed and focused upon.' },
            { k: 'p', t: 'Good image evaluation starts with consistent observation, not taste. Two annotators looking at the same image should notice the same things, even if they weigh them differently. The goal is to replace "looks good" or "feels off" with specific, observable claims.' },
            { k: 'h', t: 'Style first, then these checks' },
            { k: 'p', t: 'The checks below are written for photographic prompts. When a prompt asks for a non-photo style, illustration, cartoon, 3D, diagram, do not treat "not photorealistic" as a flaw. Judge whether the image holds together within that style; photographic cues like depth of field and photographic lighting may not apply. AI tells, garbled text, broken hands, melted features, still count regardless of style.' },
            { k: 'h', t: 'Composition and framing' },
            { k: 'p', t: 'Composition is how the elements of an image are arranged. When evaluating, ask:' },
            { k: 'list', t: [
              'Subject placement, is the main subject clearly positioned, or competing for attention with other elements?',
              'Framing scale, does the shot distance (wide, medium, close-up) match what the prompt asked for?',
              'Visual hierarchy, what draws your eye first? Does it match the intended focus?',
              'Negative space, is the area around the subject intentional breathing room, or empty and unresolved?',
            ] },
            IMG('thirds-desert.png', 'Same photo, side by side. With the rule-of-thirds grid overlaid you can see how the subject lines up on the intersections rather than dead center.'),
            { k: 'p', t: 'Notice that on the right, the rock is positioned on the left gridline. Photographers generally try to use a 3 by 3 grid to compose images. The rule of thirds places your subject in the left or right third of an image, leaving the other two thirds more open. Notice that the right image evokes more vastness and space, even though technically it is simply a different crop of the same image.' },
            { k: 'callout', t: 'A composition does not have to follow textbook rules, but it should look purposeful, not accidental.' },
            IMG('thirds-bird.jpg', 'The subject sits at a rule-of-thirds intersection rather than dead center, creating tension and directing the eye naturally across the frame.'),
            { k: 'h', t: 'Focus, detail and clarity' },
            { k: 'callout', t: 'Blur is not always a flaw. Shallow depth of field (blurred background, sharp subject) is a legitimate photographic choice. The question is whether the blur is intentional and consistent, not whether it exists.' },
            { k: 'list', t: [
              'Sharpness, is the intended subject in focus? Check edges and fine details (hair strands, eyelashes, text).',
              'Depth of field, does the blur fall off naturally from the focal point, or does it appear in patches with no logic?',
              'Compression and detail loss, is fine detail (fabric weave, skin pores, grass blades) present where the image resolution should support it? Or is the image mushy in ways that look like generation failure rather than artistic choice?',
            ] },
            IMG('dof-daffodils.png', 'The same scene shot at a wide aperture versus a narrow one. The only thing that changes is how much of the frame is in sharp focus.'),
            IMG('dof-portrait.jpg', 'Aperture f/2 against f/22. Smooth fall-off from the focal plane is a deliberate choice, not a defect.'),
          ],
          questions: [
            {
              id: 'hs1',
              extra: true,
              short: 'Non-photo style asked for',
              q: 'A prompt asks for a cartoon. The output is clearly not photorealistic. How should that affect your scoring?',
              options: [
                'Judge it within its own style. Not being photorealistic is not a flaw here',
                'Lower Visual Quality, since photorealistic images are always stronger',
                'Score it as an AI artifact, because real photos do not look like cartoons',
                'Mark a tie until a photographic version is available to compare',
              ],
              answer: 0,
              why: 'When a prompt asks for a non-photo style, do not treat "not photorealistic" as a flaw. Judge whether the image holds together within that style. AI tells like garbled text or broken hands still count regardless of style.',
            },
            {
              id: 'hs2',
              extra: true,
              short: 'Smooth versus patchy blur',
              q: 'The background is soft while the subject is sharp, and the softness falls off smoothly with distance. What is this?',
              options: [
                'Patchy blur, which is a generation tell',
                'A deliberate wide-aperture choice, not a fault',
                'A reference preservation failure',
                'Proof the image was generated rather than photographed',
              ],
              answer: 1,
              why: 'Smooth fall-off from the focal plane signals a deliberate wide-aperture choice. Patchy blur or sharp-edged halos around the subject would be the AI tell instead.',
            },
          ],
        },

        {
          id: 'quality',
          title: 'Visual Quality',
          summary: 'Contrast, colour temperature and saturation across the whole frame.',
          blocks: [
            { k: 'p', t: 'Visual Quality judges the whole image. Is it sharp, properly lit, and well composed? Penalise overall oversaturation, blurriness, or a washed-out look.' },
            { k: 'h', t: 'What to check, and what to look for' },
            { k: 'list', t: [
              'Contrast. Are highlights blown (pure white, no detail) or shadows crushed (pure black)?',
              'Colour temperature. Is the image consistently warm (golden, amber) or cool (blue, gray)? Mixed temperatures across one scene are a red flag unless the lighting explains it.',
              'Saturation. Is colour intensity consistent, or do some regions look over-processed while others are flat?',
            ] },
            IMG('saturation-tuscany.jpg', 'The same landscape, normal on the left and with saturation cranked on the right.'),
            { k: 'h', t: 'Where is the light coming from?' },
            { k: 'p', t: 'When you assess on this dimension, ask yourself: where is the light source? Where are the shadows? Where is the blur supposed to be?' },
            IMG('lighting-portrait.jpg', 'Directional light with shadows that agree on a single source.'),
            IMG('oversaturation-cinema.jpg', 'Cranked saturation and punchy colours look dramatic, but they are a Visual Quality loss and a common AI tell. The tells here: cloud detail in a sky that should be dark, lights perfectly illuminated, coat shadows falling the wrong way, and the car blurry despite shallow depth of field.'),
            { k: 'p', t: 'When colours feel pushed past what a real camera would produce, the image likely has a rendering artifact. Score it down on Visual Quality, and watch for Absence of AI Artifacts (the "filter-applied" look) as a secondary hit.' },
            IMG('composition-bike.jpg', 'Negative space used deliberately rather than left empty and unresolved.'),
            { k: 'h', t: 'Watch out for' },
            { k: 'list', t: [
              'Oversaturation, unnaturally punchy or over-processed colours.',
              'Blown highlights or crushed shadows, pure white or pure black areas with no detail.',
              'Patchy or haloed blur, depth-of-field falloff that is not smooth, or sharp-edged transitions around the subject.',
              'Mixed colour temperature in one scene, warm and cool light together with no source to explain it.',
              'Inconsistent shadow direction, shadows that do not agree on where the light is coming from.',
              'Compositional accidents, subject centered or cropped in ways that do not read as purposeful.',
            ] },
          ],
          questions: [
            {
              id: 'vq1',
              short: 'Colours past a real camera',
              q: 'Two responses look nearly identical, but one has colors pushed far past what a real camera would produce, overly even lighting, no off-color highlights, too-clean reflections. Which dimensions should this most affect?',
              options: [
                'Visual Quality (and watch Absence of AI Artifacts for the "filter-applied" look)',
                'Instruction Following, the colors mean the model ignored the prompt',
                'Person ID Preservation, saturation changes who the person is',
              ],
              answer: 0,
              why: 'Oversaturation and unnaturally even lighting are a Visual Quality loss, and the "filter-applied" look is also a tell under Absence of AI Artifacts.',
            },
            {
              id: 'vq2',
              short: 'Picnic boy, irregular fingers',
              q: 'In the picnic example, Response A shows slightly irregular fingers and toes on the boy while Response B\'s hands and feet look clean. The two are otherwise near-identical. What\'s the right move?',
              options: [
                'Prefer Response B, ambiguous extremity distortion is a known AI tell, so pick the cleaner one',
                'Mark them tied, the difference is too small to call',
                'Prefer Response A, the irregular fingers are likely just the camera angle',
              ],
              answer: 0,
              why: 'You don\'t need to name the exact artifact. Ambiguous extremity distortion is a known AI tell, pick the cleaner response rather than tying.',
            },
          ],
        },

        {
          id: 'realism',
          title: 'Realism and Artifacts',
          summary: 'The predictable ways generators fail, and how to describe them.',
          blocks: [
            { k: 'p', t: 'AI image generators fail in predictable ways. Knowing the patterns lets you spot problems quickly, and describe them precisely enough to support a rating.' },
            { k: 'h', t: 'Worked example, editing for lighting and shadow realism' },
            { k: 'p', t: 'Prompt: Can you make this bicycle look like a vintage cream city bike with a small wicker front basket? Soften the lighting a little and make it feel like an early morning street scene.' },
            IMG('bike-original.jpg', 'Original.'),
            IMG('bike-edit-a.jpg', 'Edit A.'),
            IMG('bike-edit-b.jpg', 'Edit B, fewer artifacts.'),
            { k: 'p', t: 'Edit B wins. Low directional morning light casts a dappled shadow across the wall, and the bike sits on a proper contact shadow, a believable early-morning street, which is what the prompt asked for. Edit A has two tells: a pedal is missing, and the ground shadow does not line up with any light source (the wall is lit flat, no texture). The lighting was softened by flattening it, an "AI-flat" studio shot, not a street scene.' },
            { k: 'h', t: 'Anatomy, texture and realism' },
            { k: 'list', t: [
              'Faces. Proportions: eye spacing, nose-to-mouth distance, jawline shape. Eyes: are pupils the same size? Are catchlights consistent between eyes? Skin: overly smooth or waxy skin is a common generation tell, real skin has pores, variation, and subtle texture.',
              'Hands. The most common failure point. Check finger count, finger length relative to palm, visible knuckles, natural overlap between fingers. Fused or missing fingers are immediate flags.',
              'Bodies and limbs. Limb length proportional to torso, joints bending at anatomically plausible points, clothing that drapes, folds and creases with the body underneath it.',
              'Surfaces and materials. Real materials have characteristic texture: skin has pores, fabric has weave, hair has individual strands, metal reflects. Over-smooth surfaces, tiled patterns, and loss of fine detail are all artifact signals.',
            ] },
            IMG('hand-artifact.jpg', 'A typical AI hand failure: wrong finger count, unnatural fusing, and implausible joint structure. This is what to scan for before rating anatomy.'),
            { k: 'h', t: 'AI artifact patterns' },
            { k: 'p', t: 'Artifacts cluster into four categories: anatomy failures, texture problems, text rendering, and object and scene inconsistencies. Text rendering and structural anatomy are the two artifact types that show up most in complex prompts.' },
            IMG('panda-garbled-text.jpg', 'Prompt requested a Chinese speech bubble saying "Look! Panda!". The model produced garbled pseudo-characters instead of legible text.'),
            IMG('centaur.jpg', 'The model has no real understanding of how two body types should connect, so the anatomy collapses at the join.'),
            { k: 'h', t: 'Describing what you see' },
            { k: 'p', t: 'Ratings are only useful if the justification supports them. Grounded descriptions reference what is actually in the image, not how it makes you feel.' },
            { k: 'table', t: [
              ['Weak (subjective)', 'Strong (observable)'],
              ['"This looks off"', '"The shadow on the left wall falls at a different angle than the shadow under the chair"'],
              ['"The hands look weird"', '"The right hand has six fingers; the thumb and index finger appear fused"'],
              ['"Image A is better quality"', '"Image A has sharper hair detail and consistent shadow direction; Image B\'s background is smeared and the subject\'s left arm is unnaturally elongated"'],
              ['"B feels more realistic"', '"B has more consistent skin texture and natural fabric draping; A has waxy skin and a visible seam at the subject\'s collar"'],
            ] },
            { k: 'callout', t: 'When writing a justification: name the element, describe what you observe, and connect it to the axis you are rating.' },
          ],
          questions: [
            {
              id: 'ra1',
              short: 'Strongest anatomy flag',
              q: 'You\'re rating an AI-generated portrait. Which observation is the strongest anatomy-based artifact flag?',
              options: [
                'The subject is smiling with their mouth slightly open',
                'The right hand shows six fingers, and the thumb appears fused to the index finger',
                'The background is slightly out of focus',
                'The subject\'s shirt is a solid color',
              ],
              answer: 1,
              why: 'Finger count and fusing are classic anatomy failures, the clearest, most defensible artifact call.',
            },
            {
              id: 'ra2',
              short: 'Fresh Bread garbled sign',
              q: 'A prompt asks for a storefront sign that reads "Fresh Bread." The generated image shows a sign with letter-like shapes that don\'t spell anything readable. Which artifact category is this?',
              options: [
                'Anatomy failure',
                'Object & scene inconsistency',
                'Text rendering',
                'Texture problem',
              ],
              answer: 2,
              why: 'Garbled or unreadable letters are a text rendering failure, especially common when specific words are requested.',
            },
            {
              id: 'ra3',
              short: 'Best justification for realism',
              q: 'Which justification best supports a lower rating on realism?',
              options: [
                'Image A just feels off compared to Image B',
                'Image A\'s cast shadow falls to the left of the subject while the window light comes from the left, and the subject\'s left hand has fused fingers',
                'Image A is clearly AI-generated',
                'Image A doesn\'t look as good as Image B',
              ],
              answer: 1,
              why: 'Grounded. It names the elements, describes the observation, and ties it to realism.',
            },
            {
              id: 'ra4',
              short: 'Sci-Fi telltales',
              q: 'The prompt asks to generate an imaginary scene in a Sci-Fi movie. The response shows a flying submarine in the sky, an empty street with garbled store signage, and highly intense colors overall. Which of the details are telltales when evaluating the realism / less AI Generated dimension?',
              options: [
                'Flying submarine, no submarines can fly in reality',
                'Empty street with garbled store signage, the signs aren\'t human-readable',
                'Intense colors overall, they look unnatural',
                'All of the above',
              ],
              answer: 3,
              why: 'All three are telltales. Even in an imaginary Sci-Fi scene, garbled signage and unnatural colour intensity are generation failures rather than creative choices.',
            },
            {
              id: 'ra5',
              short: 'Comic and manga realism',
              q: 'The prompt asks to generate a comic / manga styled image in a school. Which statement is correct when evaluating the realism dimension?',
              options: [
                'Comic / manga is unreal by definition, so the realism dimension is not evaluable',
                'Look for unrealistic objects that don\'t fit in the overall setting',
                'Computer-rendered images are more real than hand sketches',
                'All of the above',
              ],
              answer: 1,
              why: 'Style does not exempt an image from the realism dimension. Judge it within its own style and look for objects that do not belong in the setting.',
            },
          ],
        },

        {
          id: 'artifact',
          title: 'AI Artifact, and its scope',
          summary: 'Why it is a separate axis from Visual Quality.',
          blocks: [
            { k: 'p', t: 'In T2I tasks, an AI artifact is the still image a model generates from a text prompt. Two such images from the same prompt are shown side by side, and your job is to rate each one on four axes. One of those axes, Absence of AI Artifacts, has a specific scope: it covers generation tells visible in the image, not every quality issue. Understanding this scope is what separates a calibrated rater from one who double-penalizes.' },
            { k: 'h', t: 'Why it is its own axis' },
            { k: 'p', t: 'An image can be technically sharp, well-composed, and beautifully lit, and still contain serious artifacts. The reverse is also true: an image can have one bad hand and otherwise be excellent. If you treat artifacts as a general quality problem, you will count the same flaw twice, once on AI Artifacts and again on Visual Quality. That inflates the penalty beyond what the defect actually warrants.' },
            { k: 'callout', t: 'AI Artifacts are local, generation-specific tells: bad fingers, garbled text, tiling, floating objects. Visual Quality judges the whole image: sharpness, composition, lighting. A single bad hand is an AI Artifacts finding. Only lower Visual Quality when the whole image looks soft, blurry, or washed out.' },
            { k: 'h', t: 'Four classes to check on every T2I image' },
            { k: 'list', t: [
              'Anatomy failures',
              'Texture problems',
              'Text rendering',
              'Object and scene inconsistencies',
            ] },
            { k: 'h', t: 'Operational test' },
            { k: 'p', t: 'Ask one question for each element you inspect: is what I see explained by the prompt, or does it look like the model failed to generate it correctly? A shadow falling the wrong way is a generation failure. A blurry background in a shallow-focus portrait is composition, that is Visual Quality. Text that looks like it belongs to a different language than the prompt requested is an artifact. Text that is readable but in a different font than you would prefer is an aesthetic call, not an artifact.' },
          ],
          questions: [
            {
              id: 'ai1',
              extra: true,
              short: 'Blurry background, shallow focus',
              q: 'A shallow-focus portrait has a blurry background. Applying the operational test, where does this belong?',
              options: [
                'Absence of AI Artifacts, blur is a generation tell',
                'Visual Quality, because it is composition and the prompt explains it',
                'Both axes, since the flaw is visible',
                'Instruction Following, unless the prompt asked for blur',
              ],
              answer: 1,
              why: 'The test asks whether what you see is explained by the prompt or looks like a generation failure. A blurry background in a shallow-focus portrait is composition, which is Visual Quality, not an artifact.',
            },
          ],
        },

        {
          id: 'severity',
          title: 'How to mark severity',
          summary: 'Size the vote to the gap, not to your confidence.',
          blocks: [
            { k: 'p', t: 'Your vote strength should reflect how big the difference between the two images really is, not how confident you feel. You will use this five-point scale for Overall Preference and for each dimension you score: Strongly Prefer A, Slightly Prefer A, Tie, Slightly Prefer B, Strongly Prefer B.' },
            { k: 'h', t: 'Slightly prefer' },
            { k: 'p', t: 'The two images are broadly comparable and the call takes some deliberation. Usually one of: you can name the one detail that sets one response apart from the other, both look similar and the only difference shows up on a close look, or another rater could reasonably land the other way. Example: on AI artifacts, Response A has 3 visible artifacts and Response B has 2, just a one-artifact gap, so Slightly Prefer B.' },
            { k: 'h', t: 'Strongly prefer' },
            { k: 'p', t: 'The winner is obvious on the first look. Usually one of: the losing image has a jarring failure a casual viewer would immediately flag (bad anatomy, a required element missing or wrong, the reference style broken, an obvious artifact), or you would not second-guess it, and you would not expect another rater to land differently.' },
            { k: 'h', t: 'Tie' },
            { k: 'p', t: 'Neither image is meaningfully better after a careful look. Truly rare. Example: both responses have the same 2 artifacts at the same severity and nothing else separates them, so Tie, and still name what you compared and why it came out even.' },
            { k: 'callout', t: 'Rule of thumb. Imagine someone glanced at both images. Slightly, they would pick the winner when you ask them to choose. Strongly, they would point out the problem unprompted.' },
            { k: 'h', t: 'Example 1, a Slightly call' },
            { k: 'p', t: 'Editing prompt: add the protective headgear a construction worker wears on site, change nothing else.' },
            IMG('hardhat-reference.jpg', 'Reference.'),
            IMG('hardhat-output-a.jpg', 'Output A.'),
            IMG('hardhat-output-b.jpg', 'Output B.'),
            { k: 'p', t: 'What you see: both outputs add the hard hat cleanly. Both also subtly flatten the man\'s head shape, which the prompt did not ask for, so that flaw appears on both sides and does not separate them. The real difference: Output B adds three unnecessary white lines on his forehead; Output A does not.' },
            { k: 'p', t: 'Overall Preference, Slightly Prefer A. Both images follow the core instruction and are fully usable. The only real separator is B\'s small unrequested detail (the white lines), which you notice on a close look. The shared head-shape change does not decide the call, so the gap is real but minor, making it a Slightly, not a Strongly.' },
            { k: 'h', t: 'Example 2, a Strongly call' },
            { k: 'p', t: 'Editing prompt: Add a large, hyper-realistic human eyeball resting on the wooden floor in the immediate foreground of the hallway, centered on the floorboards and facing upward toward the ceiling, as if it has fallen from the artwork at the end.' },
            IMG('eyeball-reference.jpg', 'Reference.'),
            IMG('eyeball-output-a.jpg', 'Output A.'),
            IMG('eyeball-output-b.jpg', 'Output B.'),
            { k: 'p', t: 'What you see: Output A adds the eyeball exactly as described, large, hyper-realistic, on the floorboards, and preserves the reference\'s style and everything else. Output B recolors the eyeball and shifts the artistic style, so it looks out of place and creepy rather than blending in, and it even colorizes the man\'s eye for no reason, changes nobody asked for.' },
            { k: 'p', t: 'Overall Preference, Strongly Prefer A. B breaks the reference\'s style and adds several unrequested changes that are obvious at a glance, while A follows the prompt cleanly and preserves the source. The prompt-writer would spot the difference immediately, a big, clear gap, so it is a Strongly.' },
            { k: 'h', t: 'The most common mistake: under-calling' },
            { k: 'p', t: 'Fellows tend to default to Slightly to play it safe. Before you settle for a Slightly, check the three cases below, each one is a Strongly.' },
            { k: 'list', t: [
              'All the differentiating flaws sit on one side, one image is clean, the other carries the problems.',
              'One image misses something the prompt required, a missing or wrong required element is a Strongly, even if the rest looks similar.',
              'The same flaw repeats, the same small artifact appearing 4 times versus once is a Strongly, not a Slightly. Count matters.',
            ] },
            { k: 'callout', t: 'Bottom line: do not shrink your vote just because you are not 100% sure. Size the vote to the gap between the images, not to your confidence.' },
          ],
          questions: [
            {
              id: 'sv1',
              short: 'Red umbrella, deformed hand',
              q: 'The prompt asked to add a red umbrella to the person\'s hand. Response A adds it cleanly and everything else looks natural. Response B adds the umbrella too, but the person\'s hand is clearly deformed. Nothing else separates the two. What\'s your Overall Preference?',
              options: [
                'Strongly Prefer A',
                'Slightly Prefer A',
                'Tie',
                'Slightly Prefer B',
                'Strongly Prefer B',
              ],
              answer: 0,
              why: 'One side carries the only differentiating flaw and it\'s visible at a glance, that\'s a Strongly.',
            },
            {
              id: 'sv2',
              short: 'Three artifacts versus two',
              q: 'Both responses follow the prompt and look good overall. Only on a close look do you notice Response A has 3 minor artifacts (a couple of soft, slightly-off edges) and Response B has 2 of the same kind. Nothing else separates them. What\'s your Overall Preference?',
              options: [
                'Strongly Prefer A',
                'Slightly Prefer A',
                'Tie',
                'Slightly Prefer B',
                'Strongly Prefer B',
              ],
              answer: 3,
              why: 'A one-artifact gap you only see on close inspection is a small but real edge, Slightly Prefer B.',
            },
          ],
        },

        {
          id: 'r2i',
          title: 'Omni R2I Elo',
          summary: 'The six axes, and how Overall is decided.',
          blocks: [
            { k: 'p', t: 'In Reference-to-Image (R2I) tasks, an AI uses reference photos plus a text prompt to generate a new image. You score two responses across six dimensions: Overall, Instruction Following, Person ID, Reference Preservation, Visual Quality, and AI Artifacts.' },
            { k: 'h', t: 'For this task' },
            { k: 'list', t: [
              'Overall. Count the dimensions, whoever wins more takes Overall; a true split falls to Instruction Following.',
              'Instruction Following. The tiebreaker, decides Overall only when the dimensions split evenly.',
              'Reference Preservation. Ties OK, untargeted regions are often near-identical in both responses.',
            ] },
            { k: 'h', t: 'How to do the task' },
            { k: 'list', t: [
              'Read the prompt. Check for what the prompt asks to change. If the prompt does not ask for a particular change, keep that in mind.',
              'Review the reference image. Ask yourself, what must carry over?',
              'Study and zoom into every image. Look at hands, faces, text, and edges. Hands can be blurred or you may see an extra finger.',
              'Score the six dimensions independently. Some images will win on visual quality but lose on Person ID Preservation. Do not assume Response B wins across all categories.',
              'Pick a winner. A tie on an attribute is rare, reserve it only for when two responses genuinely perform the same on that one dimension.',
            ] },
            { k: 'callout', t: 'Annotations that tie-spam, or select "slightly prefer X" across all categories, may get a lower quality score, because you have not put in the effort to clearly distinguish the axes.' },
            { k: 'h', t: 'Watch out for' },
            { k: 'list', t: [
              'Waxy and overly smooth skin can be artifacts, not polish.',
              'Abnormal limb or finger count is a sign of AI artifacts.',
              'Unrequested camera or framing shifts may lower reference preservation.',
              'Accessories (earrings, logos) should be preserved from reference to image.',
              'Oversaturation loses on Visual Quality. Balanced compositions win.',
              'No cross-dimension trade-offs. An artifact in A does not offset an instruction failure in B.',
              'Ties as a hedge. Avoid them.',
            ] },
          ],
          questions: [
            {
              id: 'r2i1',
              short: 'Person ID, clothing and pose',
              q: 'A reference person now wears different clothing and strikes a new pose, but their facial structure and features still clearly read as the same individual. How should you score Person ID Preservation?',
              options: [
                'ID is preserved, clothing and pose don\'t define identity, the recognizable face does',
                'ID is broken, the changed clothing and pose mean the person wasn\'t preserved',
                'It depends on Visual Quality, a crisp image always preserves ID',
              ],
              answer: 0,
              why: 'Facial structure and unique human features are what Person ID measures. Changed clothing or poses do not mean ID is broken, look closely at the face.',
            },
            {
              id: 'r2i2',
              extra: true,
              short: 'Two axes each, IF favours A',
              q: 'Across the five scored dimensions, A wins two, B wins two, and one is a tie. Instruction Following favours A. What is the Overall call?',
              options: [
                'Tie, because the dimension count is level',
                'Slightly Prefer B, because ties favour the second response',
                'Slightly Prefer A, decided by Instruction Following',
                'Strongly Prefer A, because it won the tiebreaker axis',
              ],
              answer: 2,
              why: 'Count the dimensions first. A level count is a true split, and Instruction Following breaks it. It favours A, so Overall is a slight preference for A.',
            },
          ],
        },
      ]

      const ALL_QUESTIONS = LESSONS.flatMap((l) => l.questions)

      /**
       * How many times a person checked a wrong answer before checking the
       * correct one. Recorded on Check answer, not on selection, so it counts
       * deliberate submissions rather than idle clicking.
       */
      function wrongTries(q, checks) {
        const seq = (checks && checks[q.id]) || []
        const firstRight = seq.indexOf(q.answer)
        return firstRight === -1 ? seq.length : firstRight
      }

      function scoreAnswers(answers) {
        let correct = 0
        ALL_QUESTIONS.forEach((q) => {
          if (answers[q.id] === q.answer) correct++
        })
        return correct
      }

      /** Suggested reading time, derived from each lesson's own length. */
      function estimateMinutes(lesson) {
        const words = lesson.blocks.reduce((n, b) => {
          if (b.k === 'img') return n + 12
          if (b.k === 'table') return n + b.t.flat().join(' ').split(/\s+/).length
          const text = Array.isArray(b.t) ? b.t.join(' ') : b.t
          return n + text.trim().split(/\s+/).length
        }, 0)
        const qWords = lesson.questions.reduce(
          (n, q) => n + (q.q + ' ' + q.options.join(' ')).trim().split(/\s+/).length,
          0
        )
        return Math.max(1, Math.round(words / 200 + qWords / 90))
      }

      /* ---8<--- COURSE END */

      function encodeResult(payload) {
        const json = JSON.stringify(payload)
        const b64 = btoa(unescape(encodeURIComponent(json)))
        return 'HEDGE1.' + b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')
      }

      /* ================================================================ */

      const cx = (...c) => c.filter(Boolean).join(' ')

      const fmt = (secs) => {
        const s = Math.max(0, Math.round(secs))
        return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0')
      }

      /** An image slot that degrades to a labelled placeholder when the file is absent. */
      function Figure({ file, caption }) {
        const [failed, setFailed] = useState(false)
        return (
          <figure className="mt-5">
            {failed ? (
              <div className="flex min-h-[120px] flex-col items-center justify-center rounded-xl border-2 border-dashed border-slate-700 bg-slate-900/40 p-6 text-center">
                <div className="text-xs font-semibold uppercase tracking-wider text-slate-500">
                  Image not added yet
                </div>
                <code className="mt-2 text-xs text-slate-400">assets/{file}</code>
              </div>
            ) : (
              <img
                src={'./assets/' + file}
                alt={caption}
                onError={() => setFailed(true)}
                className="w-full rounded-xl border border-slate-800"
              />
            )}
            {caption && (
              <figcaption className="mt-2 text-xs leading-relaxed text-slate-500">{caption}</figcaption>
            )}
          </figure>
        )
      }

      function Block({ block }) {
        if (block.k === 'img') return <Figure file={block.file} caption={block.caption} />
        if (block.k === 'h')
          return <h3 className="mt-7 text-lg font-semibold text-slate-100">{block.t}</h3>
        if (block.k === 'p')
          return <p className="mt-3 text-[15px] leading-relaxed text-slate-300">{block.t}</p>
        if (block.k === 'table')
          return (
            <div className="mt-4 overflow-x-auto">
              <table className="w-full min-w-[520px] border-collapse text-left text-sm">
                <tbody>
                  {block.t.map((row, i) => (
                    <tr key={i} className={i === 0 ? 'bg-slate-900/80' : 'border-t border-slate-800'}>
                      {row.map((cell, j) => (
                        <td
                          key={j}
                          className={cx(
                            'px-3 py-2.5 align-top',
                            i === 0 ? 'text-xs font-bold uppercase tracking-wider text-slate-400' : 'text-slate-300',
                            i > 0 && j === 0 ? 'text-rose-300' : '',
                            i > 0 && j === 1 ? 'text-emerald-300' : ''
                          )}
                        >
                          {cell}
                        </td>
                      ))}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )
        if (block.k === 'list')
          return (
            <ul className="mt-3 space-y-2">
              {block.t.map((item, i) => (
                <li key={i} className="flex gap-3 text-[15px] leading-relaxed text-slate-300">
                  <span className="mt-2 h-1.5 w-1.5 shrink-0 rounded-full bg-indigo-400" />
                  <span>{item}</span>
                </li>
              ))}
            </ul>
          )
        return (
          <div className="mt-5 rounded-xl border-l-4 border-indigo-400/70 bg-indigo-500/10 p-4 text-[15px] leading-relaxed text-slate-200">
            {block.t}
          </div>
        )
      }

      function Question({ q, index, value, checked, onChange, onCheck }) {
        const revealed = checked !== undefined
        const right = revealed && checked === q.answer
        return (
          <div className="mt-5 rounded-2xl border border-slate-800 bg-slate-900/60 p-5">
            <div className="flex items-center gap-2">
              <span className="text-xs font-bold uppercase tracking-[0.18em] text-slate-500">
                Knowledge check
              </span>
              {q.extra && (
                <span className="rounded bg-slate-800 px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wider text-slate-400">
                  extra practice
                </span>
              )}
            </div>
            <p className="mt-3 text-[15px] font-medium leading-relaxed text-slate-100">{q.q}</p>

            <div role="radiogroup" className="mt-4 space-y-2">
              {q.options.map((opt, i) => {
                const active = value === i
                const isAnswer = revealed && i === q.answer
                const isWrongPick = revealed && active && i !== q.answer
                return (
                  <button
                    key={i}
                    role="radio"
                    aria-checked={active}
                    onClick={() => onChange(q.id, i)}
                    className={cx(
                      'flex w-full items-start gap-3 rounded-xl px-4 py-3 text-left text-sm transition focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400',
                      isAnswer
                        ? 'bg-emerald-500/20 text-emerald-100 ring-1 ring-emerald-400/50'
                        : isWrongPick
                          ? 'bg-rose-500/20 text-rose-100 ring-1 ring-rose-400/50'
                          : active
                            ? 'bg-indigo-500 text-white'
                            : 'bg-slate-800/60 text-slate-300 hover:bg-slate-800'
                    )}
                  >
                    <span
                      className={cx(
                        'mt-0.5 flex h-4 w-4 shrink-0 items-center justify-center rounded-full border',
                        active || isAnswer ? 'border-current' : 'border-slate-500'
                      )}
                    >
                      {(active || isAnswer) && <span className="h-2 w-2 rounded-full bg-current" />}
                    </span>
                    <span>{opt}</span>
                  </button>
                )
              })}
            </div>

            <div className="mt-4 flex flex-wrap items-center gap-3">
              <button
                onClick={() => onCheck(q.id)}
                disabled={value === undefined}
                className={cx(
                  'rounded-xl px-4 py-2 text-sm font-semibold transition',
                  value === undefined
                    ? 'cursor-not-allowed bg-slate-800 text-slate-600'
                    : 'bg-indigo-500 text-white hover:bg-indigo-400'
                )}
              >
                Check answer
              </button>
              {revealed && (
                <span className={cx('text-sm font-semibold', right ? 'text-emerald-400' : 'text-rose-400')}>
                  {right ? 'Correct' : 'Not quite, try again'}
                </span>
              )}
            </div>

            {revealed && right && (
              <p className="mt-3 rounded-xl bg-emerald-500/10 p-3 text-sm leading-relaxed text-emerald-200">
                {q.why}
              </p>
            )}
          </div>
        )
      }

      function Start({ onStart }) {
        const [name, setName] = useState('')
        const mins = LESSONS.reduce((n, l) => n + estimateMinutes(l), 0)
        return (
          <div className="mx-auto max-w-2xl">
            <h1 className="text-3xl font-bold text-slate-50">Image rating training</h1>
            <p className="mt-3 text-[15px] leading-relaxed text-slate-400">
              Six lessons, each ending in knowledge checks. Use Check answer as you go.
              On the last page you submit and see your score.
            </p>
            <div className="mt-6 grid grid-cols-3 gap-3">
              {[
                ['Lessons', LESSONS.length],
                ['Questions', ALL_QUESTIONS.length],
                ['Suggested', '~' + mins + ' min'],
              ].map(([k, v]) => (
                <div key={k} className="rounded-2xl border border-slate-800 bg-slate-900/60 p-4 text-center">
                  <div className="text-xs uppercase tracking-wider text-slate-500">{k}</div>
                  <div className="mt-1 text-xl font-semibold text-slate-100">{v}</div>
                </div>
              ))}
            </div>
            <div className="mt-8 rounded-2xl border border-slate-800 bg-slate-900/60 p-6">
              <label className="text-sm font-semibold text-slate-200">Who is taking this?</label>
              <div className="mt-3 grid grid-cols-2 gap-2 sm:grid-cols-4">
                {TEAM.map((n) => (
                  <button
                    key={n}
                    onClick={() => setName(n)}
                    className={cx(
                      'rounded-xl px-3 py-2.5 text-sm font-semibold transition',
                      name === n
                        ? 'bg-indigo-500 text-white'
                        : 'bg-slate-800/60 text-slate-400 hover:bg-slate-800 hover:text-slate-200'
                    )}
                  >
                    {n}
                  </button>
                ))}
              </div>
              <button
                disabled={!name}
                onClick={() => onStart(name)}
                className={cx(
                  'mt-6 w-full rounded-xl px-4 py-3 text-sm font-semibold transition',
                  name ? 'bg-indigo-500 text-white hover:bg-indigo-400' : 'cursor-not-allowed bg-slate-800 text-slate-600'
                )}
              >
                {name ? 'Start as ' + name : 'Pick your name to begin'}
              </button>
              <p className="mt-3 text-xs leading-relaxed text-slate-500">
                The suggested time is a guide, not a limit.
              </p>
            </div>
          </div>
        )
      }

      function Results({ name, answers, checks, seconds, onRestart }) {
        const score = scoreAnswers(answers)
        const total = ALL_QUESTIONS.length
        const pct = Math.round((score / total) * 100)
        const [copied, setCopied] = useState(false)
        const codeRef = useRef(null)
        const totalSecs = Object.values(seconds).reduce((a, b) => a + b, 0)

        const code = useMemo(
          () =>
            encodeResult({
              v: 1,
              n: name,
              s: score,
              t: total,
              d: new Date().toISOString().slice(0, 16),
              secs: LESSONS.map((l) => Math.round(seconds[l.id] || 0)),
              a: ALL_QUESTIONS.map((q) => (answers[q.id] === undefined ? -1 : answers[q.id])),
              w: ALL_QUESTIONS.map((q) => wrongTries(q, checks)),
              c: ALL_QUESTIONS.map((q) => (answers[q.id] === q.answer ? 1 : 0)),
            }),
          [name, score, total, seconds, answers, checks]
        )

        const copy = async () => {
          try {
            if (navigator.clipboard && window.isSecureContext) {
              await navigator.clipboard.writeText(code)
              setCopied(true)
              setTimeout(() => setCopied(false), 2500)
              return
            }
          } catch (err) {
            /* fall through */
          }
          const ta = document.createElement('textarea')
          ta.value = code
          ta.style.position = 'fixed'
          ta.style.opacity = '0'
          document.body.appendChild(ta)
          ta.select()
          let ok = false
          try {
            ok = document.execCommand('copy')
          } catch (err) {
            ok = false
          }
          document.body.removeChild(ta)
          if (ok) {
            setCopied(true)
            setTimeout(() => setCopied(false), 2500)
          } else if (codeRef.current) {
            const range = document.createRange()
            range.selectNodeContents(codeRef.current)
            const sel = window.getSelection()
            sel.removeAllRanges()
            sel.addRange(range)
          }
        }

        const tone = pct >= 80 ? 'emerald' : pct >= 60 ? 'amber' : 'rose'
        const card = {
          emerald: 'border-emerald-400/40 bg-emerald-500/10',
          amber: 'border-amber-400/40 bg-amber-500/10',
          rose: 'border-rose-400/40 bg-rose-500/10',
        }[tone]
        const chip = {
          emerald: 'bg-emerald-500 text-emerald-950',
          amber: 'bg-amber-500 text-amber-950',
          rose: 'bg-rose-500 text-rose-950',
        }[tone]

        return (
          <div className="mx-auto max-w-3xl">
            <div className={cx('rounded-2xl border p-6', card)}>
              <div className="text-xs font-bold uppercase tracking-[0.18em] text-slate-400">
                Result for {name}
              </div>
              <div className="mt-3 flex flex-wrap items-center gap-4">
                <span className={cx('rounded-xl px-4 py-2 text-3xl font-bold', chip)}>
                  {score} / {total}
                </span>
                <span className="text-2xl font-semibold text-slate-200">{pct}%</span>
                <span className="text-sm text-slate-400">Total time {fmt(totalSecs)}</span>
              </div>
            </div>

            <div className="mt-4 rounded-2xl border border-slate-800 bg-slate-900/60 p-5">
              <h2 className="text-xs font-bold uppercase tracking-[0.18em] text-slate-400">
                Send this to your lead
              </h2>
              <p
                ref={codeRef}
                className="mt-3 break-all rounded-xl bg-slate-950/60 p-3 font-mono text-[11px] leading-relaxed text-slate-400"
              >
                {code}
              </p>
              <button
                onClick={copy}
                className={cx(
                  'mt-3 w-full rounded-xl px-4 py-2.5 text-sm font-semibold transition',
                  copied ? 'bg-emerald-500 text-emerald-950' : 'bg-indigo-500 text-white hover:bg-indigo-400'
                )}
              >
                {copied ? 'Copied' : 'Copy my result code'}
              </button>
            </div>

            <h2 className="mt-8 text-lg font-semibold text-slate-100">Every question</h2>
            {LESSONS.map((lesson) => (
              <div key={lesson.id} className="mt-5">
                <div className="flex items-baseline justify-between gap-3">
                  <h3 className="text-sm font-semibold text-indigo-300">{lesson.title}</h3>
                  <span className="text-xs text-slate-500">
                    you spent {fmt(seconds[lesson.id] || 0)} of about {estimateMinutes(lesson)}:00
                  </span>
                </div>
                {lesson.questions.map((q) => {
                  const given = answers[q.id]
                  const right = given === q.answer
                  const tries = wrongTries(q, checks)
                  return (
                    <div
                      key={q.id}
                      className={cx(
                        'mt-3 rounded-2xl border p-4',
                        right ? 'border-emerald-400/30 bg-emerald-500/5' : 'border-rose-400/30 bg-rose-500/5'
                      )}
                    >
                      <span className={cx('text-sm font-bold', right ? 'text-emerald-400' : 'text-rose-400')}>
                        {right ? 'Correct' : 'Missed'}
                      </span>
                      <p className="mt-2 text-sm font-medium text-slate-200">{q.q}</p>
                      {!right && (
                        <p className="mt-2 text-sm text-rose-300">
                          You picked: {given === undefined ? 'nothing' : q.options[given]}
                        </p>
                      )}
                      <p className="mt-1 text-sm text-emerald-300">Answer: {q.options[q.answer]}</p>
                      <p className="mt-2 text-sm leading-relaxed text-slate-400">{q.why}</p>
                      {tries > 0 && (
                        <p className="mt-2 text-xs text-amber-400">
                          You checked {tries} wrong answer{tries === 1 ? '' : 's'} before this one.
                        </p>
                      )}
                    </div>
                  )
                })}
              </div>
            ))}

            <button
              onClick={onRestart}
              className="mt-8 w-full rounded-xl border border-slate-700 px-4 py-3 text-sm font-medium text-slate-300 transition hover:border-slate-500 hover:text-slate-100"
            >
              Start again
            </button>
          </div>
        )
      }

      function Shell({ children }) {
        return (
          <div className="min-h-screen bg-slate-950 text-slate-200 antialiased">
            <div className="mx-auto max-w-5xl px-4 py-8 sm:px-6 sm:py-12">
              <header className="mb-8 flex items-center justify-between gap-4">
                <div className="flex items-center gap-3">
                  <div className="flex h-10 w-10 items-center justify-center rounded-xl bg-indigo-500/15 text-lg">
                    &#128218;
                  </div>
                  <div>
                    <div className="text-sm font-semibold text-slate-50">Rating training</div>
                    <div className="text-xs tracking-wide text-slate-500">Study and knowledge checks</div>
                  </div>
                </div>
                <a
                  href="./index.html"
                  className="rounded-xl border border-slate-700 px-4 py-2 text-sm font-medium text-slate-300 transition hover:border-slate-500 hover:text-slate-100"
                >
                  Calculator
                </a>
              </header>
              {children}
            </div>
          </div>
        )
      }

      function App() {
        const [name, setName] = useState(null)
        const [page, setPage] = useState(0)
        const [answers, setAnswers] = useState({})
        // Every answer submitted via Check answer, in order, per question.
        const [checks, setChecks] = useState({})
        const [seconds, setSeconds] = useState({})
        const [done, setDone] = useState(false)

        const enter = useRef(Date.now())
        const current = LESSONS[page]

        const bank = useCallback((lessonId) => {
          const now = Date.now()
          const delta = (now - enter.current) / 1000
          enter.current = now
          if (delta <= 0) return
          setSeconds((prev) => ({ ...prev, [lessonId]: (prev[lessonId] || 0) + delta }))
        }, [])

        useEffect(() => {
          const onVisibility = () => {
            if (document.hidden) bank(LESSONS[page].id)
            else enter.current = Date.now()
          }
          document.addEventListener('visibilitychange', onVisibility)
          return () => document.removeEventListener('visibilitychange', onVisibility)
        }, [page, bank])

        const go = (delta) => {
          bank(current.id)
          setPage((p) => Math.min(LESSONS.length - 1, Math.max(0, p + delta)))
          window.scrollTo({ top: 0, behavior: 'smooth' })
        }

        const check = (id) => {
          const picked = answers[id]
          if (picked === undefined) return
          setChecks((prev) => {
            const seq = prev[id] || []
            if (seq[seq.length - 1] === picked) return prev
            return { ...prev, [id]: seq.concat(picked) }
          })
        }

        const lastChecked = (id) => {
          const seq = checks[id]
          return seq && seq.length ? seq[seq.length - 1] : undefined
        }

        const allAnswered = ALL_QUESTIONS.every((q) => answers[q.id] !== undefined)
        const answered = current ? current.questions.filter((q) => answers[q.id] !== undefined).length : 0
        const last = page === LESSONS.length - 1

        if (!name)
          return (
            <Shell>
              <Start
                onStart={(n) => {
                  setName(n)
                  enter.current = Date.now()
                }}
              />
            </Shell>
          )

        if (done)
          return (
            <Shell>
              <Results
                name={name}
                answers={answers}
                checks={checks}
                seconds={seconds}
                onRestart={() => {
                  setName(null)
                  setPage(0)
                  setAnswers({})
                  setChecks({})
                  setSeconds({})
                  setDone(false)
                }}
              />
            </Shell>
          )

        return (
          <Shell>
            <div className="mx-auto max-w-3xl">
              <div className="flex flex-wrap items-center justify-between gap-3">
                <div className="flex gap-1.5">
                  {LESSONS.map((l, i) => (
                    <span
                      key={l.id}
                      className={cx(
                        'h-1.5 w-8 rounded-full transition',
                        i < page ? 'bg-indigo-400' : i === page ? 'bg-indigo-500' : 'bg-slate-800'
                      )}
                    />
                  ))}
                </div>
                <span className="text-xs text-slate-500">
                  Page {page + 1} of {LESSONS.length} &middot; about {estimateMinutes(current)} min
                </span>
              </div>

              <h1 className="mt-6 text-2xl font-bold text-slate-50 sm:text-3xl">{current.title}</h1>
              <p className="mt-2 text-sm text-slate-400">{current.summary}</p>

              <article className="mt-6">
                {current.blocks.map((b, i) => (
                  <Block key={i} block={b} />
                ))}
              </article>

              <div className="mt-10 border-t border-slate-800 pt-6">
                <div className="flex items-baseline justify-between">
                  <h2 className="text-lg font-semibold text-slate-100">Knowledge checks</h2>
                  <span className="text-xs text-slate-500">
                    {answered} of {current.questions.length} answered
                  </span>
                </div>
                {current.questions.map((q, i) => (
                  <Question
                    key={q.id}
                    q={q}
                    index={i}
                    value={answers[q.id]}
                    checked={lastChecked(q.id)}
                    onChange={(id, v) => setAnswers((prev) => ({ ...prev, [id]: v }))}
                    onCheck={check}
                  />
                ))}
              </div>

              <div className="mt-8 flex items-center justify-between gap-3 border-t border-slate-800 pt-6">
                <button
                  onClick={() => go(-1)}
                  disabled={page === 0}
                  className={cx(
                    'rounded-xl border px-5 py-2.5 text-sm font-medium transition',
                    page === 0
                      ? 'cursor-not-allowed border-slate-900 text-slate-700'
                      : 'border-slate-700 text-slate-300 hover:border-slate-500 hover:text-slate-100'
                  )}
                >
                  Previous
                </button>

                {last ? (
                  <button
                    onClick={() => {
                      bank(current.id)
                      setDone(true)
                      window.scrollTo({ top: 0, behavior: 'smooth' })
                    }}
                    disabled={!allAnswered}
                    className={cx(
                      'rounded-xl px-6 py-2.5 text-sm font-semibold transition',
                      allAnswered
                        ? 'bg-emerald-500 text-emerald-950 hover:bg-emerald-400'
                        : 'cursor-not-allowed bg-slate-800 text-slate-600'
                    )}
                  >
                    {allAnswered ? 'Submit and see my score' : 'Answer every question first'}
                  </button>
                ) : (
                  <button
                    onClick={() => go(1)}
                    className="rounded-xl bg-indigo-500 px-6 py-2.5 text-sm font-semibold text-white transition hover:bg-indigo-400"
                  >
                    Next
                  </button>
                )}
              </div>

              {last && !allAnswered && (
                <p className="mt-3 text-right text-xs text-amber-400">
                  Some questions on earlier pages are still blank. Use Previous to finish them.
                </p>
              )}
            </div>
          </Shell>
        )
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />)
    </script>
  </body>
</html>
