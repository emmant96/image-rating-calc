<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Hedgehog I2V Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      // Same pin as the image calculator: the stock "react" preset defaults to the
      // automatic JSX runtime, which emits an import statement that cannot run in a
      // plain script. Classic runtime compiles to React.createElement instead.
      Babel.registerPreset('react-classic', {
        presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]],
      })
    </script>
    <style>
      #root:empty::after {
        content: 'Loading...';
        display: block;
        padding: 3rem;
        text-align: center;
        color: #64748b;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
    </style>
  </head>
  <body class="bg-slate-950">
    <div id="root"></div>

    <script type="text/babel" data-presets="react-classic">
      const { useCallback, useEffect, useMemo, useRef, useState } = React

      /* ================================================================
       * IMAGE TO VIDEO REVIEW ENGINE
       *
       * This is deliberately NOT the image calculator's engine.
       *
       * On the image tasks the overall preference is worked out from the axes:
       * you score the rows and the tool tells you who won. On video the rubric
       * says the opposite. Overall Preference is scored first, as a gut call,
       * and is explicitly not an average or a count of the rows. A rater who
       * tallies rows to reach the overall is marked wrong.
       *
       * So this engine never computes a verdict. You make the call; it shows how
       * the rows landed and warns about the habits reviewers keep catching.
       *
       * The whole task is budgeted at ten minutes, and watching two clips
       * properly eats five to six of them. Everything here is sized for the four
       * minutes that leaves: the warnings are short, and the justification asks
       * only for the things that actually decided the pair.
       * ---8<--- VIDEO START
       * ================================================================ */

      const AXES = {
        overall: {
          key: 'overall',
          title: 'Overall Preference',
          decisive: true,
          blurb:
            'Which video is just better? Answer this one first, before you look at anything below it. Imagine your mum and dad walked past both clips. Which one would they say is the better video? That gut feeling is the answer. Do not add up the rows to get here.',
          slight: 'You would pick it, but you had to think about it.',
          strong: 'You would pick it straight away. The other one misses the point of the prompt, or it just feels broken.',
        },
        instruction: {
          key: 'instruction',
          title: 'Instruction Following',
          blurb:
            'Did the video do everything the words asked for? Walk the prompt one bit at a time. If it says first this, then that, the order counts too. A bit that never happens at all is a big miss, not a small one.',
          slight: 'Both deliver the main beats. One is a little tighter on a small detail.',
          strong: 'Something asked for is fully missing: the wrong number of things, a missing subject, the wrong style, or the beats out of order.',
        },
        visual: {
          key: 'visual',
          title: 'Frame Visual Quality',
          blurb:
            'Freeze the picture and look at it. Is it sharp, not too bright, not too dark, with real looking colour? Do materials look like what they are, so frost looks like frost and skin looks like skin and not shiny plastic? One blurry face right after a cut counts here too. It does not have to be the whole clip.',
          slight: 'One soft object or one soft moment, a mild colour cast, slightly flat light.',
          strong: 'Soft all the way through, several things failing at once, blown out whites, crushed blacks, or a strong colour tint that nothing explains.',
          note:
            'A look the maker chose on purpose is not a fault, even if you dislike it. An unexplained tint, blown highlights and crushed blacks are faults. Ask whether the look is something the whole picture is built around, or an error sitting on top of it.',
        },
        motion: {
          key: 'motion',
          title: 'Motion and Temporal Quality',
          blurb:
            'Now watch it move. Does it move the way that thing really moves? Look for stutter, a jerky camera, flicker, and speed that feels wrong, like hands dealing cards far faster than any real person would. Nothing impossible is happening here. It just moves badly.',
          slight: 'A brief stutter, or movement that is a bit stiff.',
          strong: 'Stutter or jitter running through the clip, dropped frames, a badly unstable camera, or pacing and cuts that break the action.',
        },
        audio: {
          key: 'audio',
          title: 'Audio Quality and Sync',
          blurb:
            'Turn the sound on before you start. Is it clean, and does it line up with the picture? If you can see a mouth moving, the words should match it. If two people are talking, you should hear two different voices.',
          slight: 'A bit of hiss, or a footstep landing a hair late.',
          strong: 'Two people on screen sharing one voice, speech you cannot make out, or a sound the prompt asked for that is simply not there.',
        },
        artifacts: {
          key: 'artifacts',
          title: 'Less AI Generated',
          blurb:
            'Look for things that could not be real. An extra arm appearing, a building growing, an object jumping across the frame, letters turning to mush, five puppies becoming six. This row is not about how it moves. It is about what it is.',
          slight: 'One short, small tell that you had to scrub back to catch.',
          strong: 'Impossible things stacked up, or going on and on, the kind an ordinary viewer would notice.',
        },
        personId: {
          key: 'personId',
          title: 'Person ID Preservation',
          blurb:
            'Is it still the same person from the starting picture? Look at the face only. New clothes or a new pose is fine. Check the face at several points in the clip, not just the first frame, because faces drift once the video starts moving. If nobody appears in the starting picture or in either video, choose N/A.',
          slight: 'The face drifts a little once she starts moving, but it is still clearly the same person.',
          strong: 'It stops being the same person.',
        },
        contentPres: {
          key: 'contentPres',
          title: 'Content and Reference Preservation',
          blurb:
            'Everything the prompt did not ask to change should stay the same: the background, the clothing, the objects, the light. Check the last few seconds as well, because this is where it usually slips. If there is nothing to carry over except the person, choose N/A.',
          slight: 'Detail drift only: a colour shifts, the hair changes, the framing widens, a small accessory goes missing.',
          strong: 'Core reference content is lost: a person missing, clothing swapped, a different place, the scene no longer joining up.',
          note:
            'The starting picture does not have to be the first frame of the video. Do not mark a clip down just because it does not open on it. Judge whether the person and the untouched parts hold across the whole clip.',
        },
      }

      /** One task. The team only rates image to video, so there is nothing to pick. */
      const TASK = {
        id: 'i2v',
        label: 'Image to Video',
        short: 'I2V',
        axes: ['overall', 'instruction', 'visual', 'motion', 'audio', 'artifacts', 'personId', 'contentPres'],
      }

      const OPTIONS = [
        { value: 2, label: 'Strongly A', side: 'A' },
        { value: 1, label: 'Slightly A', side: 'A' },
        { value: 0, label: 'Tie', side: 'T' },
        { value: -1, label: 'Slightly B', side: 'B' },
        { value: -2, label: 'Strongly B', side: 'B' },
      ]

      const NA = 'na'
      const NA_OPTION = { value: NA, label: 'N/A', side: 'N' }

      /**
       * Only the two preservation rows carry N/A, because those are the only two
       * the guidance puts it on. Audio deliberately does not get one: a silent
       * clip where the prompt implied sound is a failure to score, not a row to
       * skip.
       */
      const NA_AXES = { personId: true, contentPres: true }

      const optionsFor = (key) => (NA_AXES[key] ? OPTIONS.concat([NA_OPTION]) : OPTIONS)

      const isScored = (v) => typeof v === 'number'

      /* ----------------------------------------------------------------
       * Telling the two "something looks wrong" rows apart.
       * The single most common mix up, so the wording is kept close to source.
       * ---------------------------------------------------------------- */

      const MOTION_TELLS = [
        'Jitter or stutter',
        'Frame drops',
        'Unnatural pacing',
        'POV bounce',
        'Flickering',
        'Unstable zoom or pan',
        'Too many cuts, or cuts for no reason',
      ]

      const ARTIFACT_TELLS = [
        'Extra limbs appearing',
        'Buildings growing',
        'Objects teleporting',
        'Shirt numbers or text morphing',
        'Impossible geometry or physics',
        'Repeating AI patterns',
        'Identity drift',
      ]

      const SPLIT_RULE =
        'The thing is fine but moves badly, that is Motion and Temporal. The thing itself could not exist, that is Less AI Generated. Quick trick: pause the video. If a frozen frame, or the jump between two frames, shows something impossible, it is Less AI Generated. If every frame looks fine and only the flow is off, it is Motion and Temporal.'

      const MATERIAL_RULE =
        'How real a material looks belongs here: frost that does not look like frost, sugar with no proper grain, skin with a plastic sheen where pores should be. A thing that could not exist belongs on Less AI Generated instead: six fingers, an arm appearing, bodies melting together, letters turning to mush.'

      /* ----------------------------------------------------------------
       * Prompt beats
       *
       * Instruction Following is the one row with a checkable structure: the
       * prompt names beats, and each beat either lands or it does not. A fully
       * missed requirement is a strong call, so counting misses gives a real
       * suggestion rather than a guess. It stays a suggestion; a beat both sides
       * deliver at different quality is not something a checklist can see.
       * ---------------------------------------------------------------- */

      function beatSuggestion(beats) {
        const done = (beats || []).filter((b) => b.a !== null && b.b !== null)
        if (done.length === 0) return null
        const missA = done.filter((b) => !b.a).length
        const missB = done.filter((b) => !b.b).length
        if (missA === missB) {
          return {
            value: 0,
            text:
              missA === 0
                ? 'Both clips do every beat you listed. If one is still tighter, that is a small call about how well, not about whether.'
                : 'Both clips miss ' +
                  missA +
                  ' beat' +
                  (missA === 1 ? '' : 's') +
                  '. Equal misses do not separate them, so this row leans Tie unless one miss is worse than the other.',
          }
        }
        const winner = missA < missB ? 'A' : 'B'
        const loser = winner === 'A' ? 'B' : 'A'
        const gap = Math.abs(missA - missB)
        return {
          value: winner === 'A' ? 2 : -2,
          text:
            loser +
            ' completely misses ' +
            gap +
            ' beat' +
            (gap === 1 ? '' : 's') +
            ' that ' +
            winner +
            ' does. Something asked for and never done is a big miss, so this points at Strongly ' +
            winner +
            '.',
        }
      }

      /* ----------------------------------------------------------------
       * Warnings
       *
       * Every warning below is a habit reviewers have actually marked people
       * down for. They are written to be read in a few seconds, because the
       * task does not have time for anything longer.
       *
       * Returns the row split too. The split is information, never a verdict: it
       * is there so the rater can see the shape of their own annotation, not so
       * they can copy it into the overall row.
       * ---------------------------------------------------------------- */

      const LEVEL_RANK = { stop: 0, check: 1, note: 2 }

      function reviewVideo(scores) {
        const rows = TASK.axes.filter((k) => k !== 'overall')
        const filled = TASK.axes.filter((k) => scores[k] !== undefined).length
        const total = TASK.axes.length
        const complete = filled === total

        const judged = rows.filter((k) => isScored(scores[k])).map((k) => scores[k])
        const winsA = judged.filter((v) => v > 0).length
        const winsB = judged.filter((v) => v < 0).length
        const ties = judged.filter((v) => v === 0).length
        const net = judged.reduce((sum, v) => sum + v, 0)
        const overall = scores.overall
        const flags = []

        const add = (level, title, detail) => flags.push({ level, title, detail })

        // Fires as soon as N/A is used, because the rule is about whether the row
        // exists at all, which does not depend on the other rows.
        if (rows.some((k) => scores[k] === NA)) {
          add(
            'note',
            'You used N/A',
            'Person ID is N/A only when there is nobody in the starting picture and nobody in either video. Content preservation is N/A only when there is nothing to carry over except the person. If the row can be judged at all, judge it. N/A is not a way out of a close call.'
          )
        }

        if (overall === 0) {
          add(
            'check',
            'Your overall is a tie',
            'You are asked to pick a winner even when it is close. A tie here needs a reason you could say out loud: the same flaw, as often, and as bad, in both clips, and you checked both.'
          )
        }

        if (!complete) {
          flags.sort((x, y) => LEVEL_RANK[x.level] - LEVEL_RANK[y.level])
          return { complete, filled, total, overall, tally: { winsA, winsB, ties, net, judged: judged.length }, flags }
        }

        const nonTie = judged.filter((v) => v !== 0)

        if (overall === 0 && ties === judged.length) {
          // The stronger warning replaces the milder one rather than stacking.
          flags.splice(flags.findIndex((f) => f.title === 'Your overall is a tie'), 1)
          add(
            'stop',
            'You tied everything',
            'Nobody learns anything from a sheet where every row is a tie. One rater who did this on a hard pair was scored 2 out of 5. If you cannot name a single row where one video is better, watch both again. There is almost always something.'
          )
        } else {
          if (judged.length >= 4 && ties >= Math.ceil(judged.length * 0.6)) {
            add(
              'check',
              'Most of your rows came out even',
              'Ties are meant to be rare. A real tie means the same flaw, as often, and as bad, in both clips. If you cannot say that sentence about a row, look at that row again.'
            )
          }
        }

        // The watch advert lesson: the overall winner was right, two rows were
        // overcalled because both clips shared the problem.
        const sweepSide =
          nonTie.length === judged.length && judged.length >= 3
            ? winsA === judged.length
              ? 'A'
              : winsB === judged.length
                ? 'B'
                : null
            : null
        if (sweepSide && overall !== 0 && (overall > 0 ? 'A' : 'B') === sweepSide) {
          add(
            'check',
            'One video won every single row',
            'That happens, but it is rare, and it is the thing reviewers check hardest. One rater was marked down for exactly this: the winner was right, but two rows were handed to it when both clips had the same problem. Say one thing that is wrong with the winner too.'
          )
        }

        // The protest clip lesson: legitimate, but it is the exception and it has
        // to be argued rather than left implicit.
        if (overall !== 0 && nonTie.length > 0) {
          const overallSide = overall > 0 ? 1 : -1
          if (nonTie.every((v) => Math.sign(v) !== overallSide)) {
            add(
              'check',
              'Your overall pick lost every row',
              'This is allowed, and sometimes right. One real pair went to the video that lost on motion and on AI tells, because the other one missed the main thing the prompt asked for. But it is the exception, so write down which part of the prompt the other video missed, and why that outweighs everything it won.'
            )
          }
        }

        if (Math.abs(overall) === 2 && !judged.some((v) => Math.abs(v) === 2)) {
          add(
            'check',
            'You said Strongly, but nothing below is strong',
            'Strongly means you would pick it without thinking, because the other one misses the point of the prompt or feels broken. If no single row was a strong call, write one line saying where the big gap actually is.'
          )
        }

        if (nonTie.length >= 3 && nonTie.every((v) => Math.abs(v) === 1) && Math.abs(overall) <= 1) {
          add(
            'note',
            'Every call you made is a small one',
            'Picking Slightly to play safe is wrong, because it hides real gaps. Slightly and Strongly are about how big the difference is, not how sure you are. Ask how much better the winner is, not how confident you feel.'
          )
        }

        flags.sort((x, y) => LEVEL_RANK[x.level] - LEVEL_RANK[y.level])
        return { complete, filled, total, overall, tally: { winsA, winsB, ties, net, judged: judged.length }, flags }
      }

      /* ----------------------------------------------------------------
       * Justification skeleton
       *
       * Sized for the time the task actually has. Watching properly leaves about
       * four minutes to write, and every blank is one thing you must have seen
       * and have to type. So the skeleton writes a line for each row that
       * actually separated the two clips, folds the even rows into a single
       * short line, and folds the not applicable rows into another. A row that
       * decided nothing does not earn a sentence.
       *
       * The calculator has not seen the videos, so every claim about what is on
       * screen is left as a blank. The blanks ask for a timestamp, because every
       * reviewer comment in the guidance names a specific thing at a specific
       * time.
       * ---------------------------------------------------------------- */

      const AXIS_PHRASE = {
        instruction: 'instruction following',
        visual: 'frame visual quality',
        motion: 'motion and temporal quality',
        audio: 'audio quality and sync',
        artifacts: 'AI tells',
        personId: 'person ID preservation',
        contentPres: 'content preservation',
      }

      const ORDER = ['instruction', 'visual', 'motion', 'audio', 'artifacts', 'personId', 'contentPres']

      /** What the rater has to supply, kept short because they have to type it. */
      const EVIDENCE = {
        instruction: [
          'name the beat from the prompt that is missing or out of order',
          'quote the part of the prompt that does not get delivered',
          'say which requirement lands in one clip and not the other',
        ],
        visual: [
          'name what is soft or blown out, and the time',
          'name the material that does not look real, such as frost, glass, or skin',
          'say what the colour does wrong, and where',
        ],
        motion: [
          'name the moment and the time, such as the camera stutters at 0:04',
          'say what moves at the wrong speed, and when',
          'say what the pacing does wrong and where it starts',
        ],
        audio: [
          'say what you heard and when',
          'name the sound the prompt asked for that is missing or garbled',
          'say where the sound stops matching the picture',
        ],
        artifacts: [
          'name the impossible detail and the time it appears',
          'say what could not exist in real footage, and where',
          'say whether it is one blip or runs all the way through',
        ],
        personId: [
          'say where the face drifts and what changes',
          'name the feature that moves away from the picture, such as the jaw or the hairline',
          'say at what second it stops being the same person',
        ],
        contentPres: [
          'name what changed that nobody asked to change',
          'say which part of the background, clothing, or light drifts, and when',
          'name the detail from the starting picture that does not carry over',
        ],
      }

      const PHRASES = {
        overallStrong: [
          'I strongly prefer Response {W}: [say in one line what makes it clearly better].',
          'Response {W} is clearly the stronger video: [name the thing that decides it straight away].',
          'This is a strong preference for Response {W}: [say what {L} misses or breaks].',
        ],
        overallSlight: [
          'I slightly prefer Response {W}: [say what tipped it, knowing it was close].',
          'Response {W} has the narrow edge: [name the one thing that decided it].',
          'On balance Response {W} is the better video: [say what you kept coming back to].',
        ],
        overallTie: [
          'Neither video is stronger: [say what you compared and why it came out even].',
          'I cannot separate the two: [name the flaw that shows up as often and as badly in both].',
        ],
        wins: [
          'On {axis}, {W} is stronger: [{ev}].',
          '{W} leads on {axis}: [{ev}].',
          '{W} is ahead on {axis}: [{ev}].',
        ],
        even: [
          'Even on {list}: [say in a few words what both clips do there].',
          '{ListCap} separated nothing: [say briefly what both clips do].',
        ],
        notApplicable: [
          'Not applicable: {list}, because [say why, for example nobody appears in the starting picture].',
          '{ListCap} does not apply here: [say what the starting picture actually shows].',
        ],
        sweep: [
          'Against {W}: [name one thing the winner gets wrong too].',
          'What is wrong with {W}: [name a flaw in the winner, so this is not a clean sweep with nothing said].',
        ],
        // Used when the form asks for Overall and nothing else. There is no row
        // to point at, so the skeleton asks straight out for the things a
        // justification is marked on: one concrete moment, a fault in the
        // winner, and what the loser does better.
        example: [
          'The clearest example: [name one thing you saw and when, such as the camera stutters at 0:04].',
          'What made it obvious: [name the moment and the time you saw it].',
          'The thing that decided it: [name what happens, in which clip, and when].',
        ],
        againstWinner: [
          'Against {W}: [name one thing the winner gets wrong too].',
          '{W} is not perfect either: [name a fault in the video you picked].',
        ],
        loserBetter: [
          '{L} does do better on: [name the one thing {L} wins, and say why it does not outweigh the rest].',
          'In fairness to {L}: [name what it does better, and why {W} still wins].',
        ],
        tieEvidence: [
          'The same in both: [name the flaw you found in each clip, and roughly when, so it is clear you checked both].',
          'What makes it level: [name the flaw that turns up as often and as badly in both clips].',
        ],
        tradeoff: [
          'Trade-off: {L} does take {loseList}, but [say why that matters less].',
          '{L} wins {loseList}, and [say why {W} is still the better video].',
        ],
        opposed: [
          'The rows lean to {L} and I still picked {W}: [name the part of the prompt {L} misses].',
          'This goes against the rows on purpose: [say which requirement {L} fails and why it outweighs the rest].',
        ],
      }

      const pick = (list, seed, offset) => list[Math.abs(seed + offset) % list.length]

      const fillTemplate = (template, vars) =>
        template.replace(/\{(\w+)\}/g, (m, key) => (key in vars ? vars[key] : m))

      const listOf = (items) =>
        items.length <= 1
          ? items[0] || ''
          : items.slice(0, -1).join(', ') + ' and ' + items[items.length - 1]

      const capitalise = (t) => t.charAt(0).toUpperCase() + t.slice(1)

      /**
       * Build the skeleton.
       *
       * It needs Overall and nothing else, because some forms ask for Overall
       * alone. On those the rows are still what you look at, they are just not
       * fields you submit, so the justification still has to carry the same
       * things: one concrete moment, a fault in the winner, and what the loser
       * does better. With no rows scored the skeleton asks for those directly.
       * Score a row and its own line replaces the generic ask.
       */
      function buildVideoStarter(scores, seed) {
        if (scores.overall === undefined) return null
        const review = reviewVideo(scores)
        const s = seed || 0
        const overall = scores.overall
        const W = overall > 0 ? 'A' : overall < 0 ? 'B' : 'T'
        const L = W === 'A' ? 'B' : 'A'
        const lines = []

        // 1. Overall first, because that is the order the task is scored in.
        if (W === 'T') {
          lines.push(pick(PHRASES.overallTie, s, 0))
        } else {
          const pool = Math.abs(overall) === 2 ? PHRASES.overallStrong : PHRASES.overallSlight
          lines.push(fillTemplate(pick(pool, s, 0), { W, L }))
        }

        // 2. A line for each row that actually separated the two clips. Rows that
        //    decided nothing do not get a sentence of their own.
        const split = ORDER.filter((k) => isScored(scores[k]) && scores[k] !== 0)
        split.forEach((k, i) => {
          const v = scores[k]
          lines.push(
            fillTemplate(pick(PHRASES.wins, s, i + 1), {
              axis: AXIS_PHRASE[k],
              W: v > 0 ? 'A' : 'B',
              L: v > 0 ? 'B' : 'A',
              ev: pick(EVIDENCE[k], s, i + 1),
            })
          )
        })

        // 3. The even rows and the not applicable rows, one short line each.
        const even = ORDER.filter((k) => scores[k] === 0).map((k) => AXIS_PHRASE[k])
        if (even.length) {
          lines.push(
            fillTemplate(pick(PHRASES.even, s, 8), { list: listOf(even), ListCap: capitalise(listOf(even)) })
          )
        }
        const na = ORDER.filter((k) => scores[k] === NA).map((k) => AXIS_PHRASE[k])
        if (na.length) {
          lines.push(
            fillTemplate(pick(PHRASES.notApplicable, s, 9), { list: listOf(na), ListCap: capitalise(listOf(na)) })
          )
        }

        // 4. At least one concrete moment. A scored row already carries its own,
        //    so this only appears when nothing below Overall was scored, which is
        //    exactly the Overall only form. Without it the whole justification
        //    would be an opinion with no evidence under it.
        if (W !== 'T' && split.length === 0 && even.length === 0 && na.length === 0) {
          lines.splice(1, 0, pick(PHRASES.example, s, 10))
        }

        // 5. The lines reviewers say are missing most often: something against
        //    the winner, and what the loser does better. On a finished sheet the
        //    warnings and the scores decide whether these are needed. With no
        //    rows to read, ask for both every time.
        const warned = review.flags.map((f) => f.title)
        const lost = split
          .filter((k) => (W === 'A' ? scores[k] < 0 : scores[k] > 0))
          .map((k) => AXIS_PHRASE[k])

        if (warned.indexOf('One video won every single row') !== -1) {
          lines.push(fillTemplate(pick(PHRASES.sweep, s, 11), { W, L }))
        } else if (!review.complete && W !== 'T') {
          // Nothing scored disagrees with the pick yet, so the fault in the
          // winner has to be asked for rather than inferred.
          lines.push(fillTemplate(pick(PHRASES.againstWinner, s, 11), { W, L }))
        }

        if (warned.indexOf('Your overall pick lost every row') !== -1) {
          lines.push(fillTemplate(pick(PHRASES.opposed, s, 12), { W, L }))
        }

        if (W === 'T') {
          if (!review.complete) lines.push(pick(PHRASES.tieEvidence, s, 13))
        } else if (lost.length) {
          lines.push(fillTemplate(pick(PHRASES.tradeoff, s, 13), { W, L, loseList: listOf(lost) }))
        } else if (!review.complete) {
          lines.push(fillTemplate(pick(PHRASES.loserBetter, s, 13), { W, L }))
        }

        return lines.join(' ')
      }

      /**
       * What the skeleton costs to finish.
       *
       * The raw character count is misleading, because a blank reading "name the
       * moment and the time, such as the camera stutters at 0:04" gets replaced
       * by something much shorter. What matters is how many blanks there are,
       * since each one is a separate thing the rater must have seen and has to
       * type inside a ten minute task.
       */
      function skeletonCost(text) {
        if (!text) return null
        const blanks = (text.match(/\[[^\]]+\]/g) || []).length
        const fixed = text
          .replace(/\[[^\]]+\]/g, ' ')
          .split(/\s+/)
          // Only real words. A stray full stop left behind by a removed blank
          // is not something anyone has to type.
          .filter((w) => /[a-z0-9]/i.test(w)).length
        // A filled blank is a short observation, about seven words in the
        // examples the guidance quotes.
        const words = fixed + blanks * 7
        // The floor is set below what an Overall only sheet produces, since that
        // is a legitimate shape and not a thin answer.
        return { blanks, words, roomy: blanks <= 7 && words >= 35 && words <= 130 }
      }

      /** Every wording for every slot, so seven people do not submit one sentence. */
      function videoStarterAlternatives(scores) {
        if (scores.overall === undefined) return []
        const overall = scores.overall
        const W = overall > 0 ? 'A' : overall < 0 ? 'B' : 'T'
        const L = W === 'A' ? 'B' : 'A'
        const out = []

        const overallPool =
          W === 'T' ? PHRASES.overallTie : Math.abs(overall) === 2 ? PHRASES.overallStrong : PHRASES.overallSlight
        out.push({ slot: 'Overall', options: overallPool.map((t) => fillTemplate(t, { W, L })) })

        ORDER.filter((k) => isScored(scores[k]) && scores[k] !== 0).forEach((k) => {
          const v = scores[k]
          const opts = []
          PHRASES.wins.forEach((frame) => {
            EVIDENCE[k].forEach((ev) => {
              opts.push(fillTemplate(frame, { axis: AXIS_PHRASE[k], W: v > 0 ? 'A' : 'B', L: v > 0 ? 'B' : 'A', ev }))
            })
          })
          out.push({ slot: AXES[k].title, options: opts })
        })

        const even = ORDER.filter((k) => scores[k] === 0).map((k) => AXIS_PHRASE[k])
        if (even.length) {
          out.push({
            slot: 'The even rows',
            options: PHRASES.even.map((t) =>
              fillTemplate(t, { list: listOf(even), ListCap: capitalise(listOf(even)) })
            ),
          })
        }

        const na = ORDER.filter((k) => scores[k] === NA).map((k) => AXIS_PHRASE[k])
        if (na.length) {
          out.push({
            slot: 'Not applicable',
            options: PHRASES.notApplicable.map((t) =>
              fillTemplate(t, { list: listOf(na), ListCap: capitalise(listOf(na)) })
            ),
          })
        }

        return out
      }

      /* ---8<--- VIDEO END */

      function ReviewCard({ review, overallOnly }) {

      function FeedbackStarter({ text, cost, alternatives, onReword, builtFrom }) {
        const [showBank, setShowBank] = useState(false)
        const [status, setStatus] = useState('idle')
        const textRef = useRef(null)

        useEffect(() => setStatus('idle'), [text])

        const copyViaTextarea = () => {
          const ta = document.createElement('textarea')
          ta.value = text
          ta.setAttribute('readonly', '')
          ta.style.position = 'fixed'
          ta.style.top = '0'
          ta.style.opacity = '0'
          document.body.appendChild(ta)
          ta.select()
          let ok = false
          try {
            ok = document.execCommand('copy')
          } catch (err) {
            ok = false
          }
          document.body.removeChild(ta)
          return ok
        }

        const selectVisibleText = () => {
          if (!textRef.current) return
          const range = document.createRange()
          range.selectNodeContents(textRef.current)
          const sel = window.getSelection()
          sel.removeAllRanges()
          sel.addRange(range)
        }

        const copy = async () => {
          try {
            if (navigator.clipboard && window.isSecureContext) {
              await navigator.clipboard.writeText(text)
              setStatus('copied')
              setTimeout(() => setStatus('idle'), 2000)
              return
            }
          } catch (err) {
            // Fall through to the legacy path.
          }
          if (copyViaTextarea()) {
            setStatus('copied')
            setTimeout(() => setStatus('idle'), 2000)
            return
          }
          selectVisibleText()
          setStatus('manual')
        }

        const copied = status === 'copied'

        return (
          <div className="mt-3 rounded-2xl border border-slate-800 bg-slate-900/50 p-5">
            <div className="flex items-center justify-between gap-3">
              <h3 className="text-xs font-bold uppercase tracking-[0.18em] text-slate-400">Justification skeleton</h3>
              <span
                className={cx(
                  'rounded-md px-2 py-1 text-xs font-semibold',
                  cost.roomy ? 'bg-slate-800/80 text-slate-400' : 'bg-amber-500/20 text-amber-300'
                )}
                title="Each blank is one thing you have to have seen and have to type"
              >
                {cost.blanks} blanks &middot; about {cost.words} words
              </span>
            </div>

            <p className="mt-2 text-[11px] font-medium uppercase tracking-wider text-slate-500">{builtFrom}</p>

            <p
              ref={textRef}
              className="mt-2 max-h-72 overflow-y-auto rounded-xl bg-slate-950/60 p-3 text-sm leading-relaxed text-slate-300 selection:bg-indigo-500/40"
            >
              {text}
            </p>

            <button
              onClick={copy}
              className={cx(
                'mt-3 w-full rounded-xl px-4 py-2.5 text-sm font-semibold transition focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400',
                copied
                  ? 'bg-emerald-500 text-emerald-950'
                  : status === 'manual'
                    ? 'bg-amber-500 text-amber-950'
                    : 'bg-indigo-500 text-white hover:bg-indigo-400'
              )}
            >
              {copied ? 'Copied' : status === 'manual' ? 'Selected, press Ctrl+C' : 'Copy skeleton'}
            </button>

            <button
              onClick={onReword}
              className="mt-2 w-full rounded-xl border border-slate-800 px-4 py-2 text-xs font-medium text-slate-400 transition hover:border-slate-600 hover:text-slate-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400"
            >
              Reword it
            </button>

            <p className="mt-2.5 text-xs leading-relaxed text-slate-500">
              Swap each blank for the moment you actually saw, with a time where you can give one, such as "his
              face goes blurry at 0:07 after the cut". Never "B looks better". You should be able to finish it in
              about four minutes. If you cannot answer a blank from what you watched, go back and look rather
              than guessing at it.
            </p>

            {alternatives && alternatives.length > 0 && (
              <div className="mt-3 border-t border-slate-800 pt-3">
                <button
                  onClick={() => setShowBank((v) => !v)}
                  className="flex w-full items-center justify-between text-xs font-semibold text-slate-400 transition hover:text-slate-200"
                >
                  <span>Other ways to say it</span>
                  <span>{showBank ? 'hide' : 'show'}</span>
                </button>
                {showBank && (
                  <div className="mt-3 space-y-3">
                    {alternatives.map((group) => (
                      <div key={group.slot}>
                        <div className="text-[11px] font-bold uppercase tracking-wider text-slate-500">{group.slot}</div>
                        <ul className="mt-1 space-y-1">
                          {group.options.map((opt, i) => (
                            <li key={i} className="rounded-lg bg-slate-950/50 px-2.5 py-1.5 text-xs leading-relaxed text-slate-400">
                              {opt}
                            </li>
                          ))}
                        </ul>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </div>
        )
      }

      function App() {
        const [scores, setScores] = useState({})
        const [beats, setBeats] = useState([])
        const [seed, setSeed] = useState(() => Math.floor(Math.random() * 1e9))
        // Some forms ask for Overall and nothing else. The rows below stay on
        // screen either way, because they are still what you look at, but this
        // stops the page nagging for scores the form will never take.
        const [overallOnly, setOverallOnly] = useState(false)

        // Nothing on this page runs on a clock. Scores stay exactly where the
        // rater put them until they press the clear button themselves.
        const setScore = useCallback((axisKey, value) => {
          setScores((prev) => {
            const next = Object.assign({}, prev)
            if (value === undefined) delete next[axisKey]
            else next[axisKey] = value
            return next
          })
        }, [])

        const restart = () => {
          setScores({})
          setBeats([])
        }

        const review = useMemo(() => reviewVideo(scores), [scores])
        const starter = useMemo(() => buildVideoStarter(scores, seed), [scores, seed])
        const cost = useMemo(() => skeletonCost(starter), [starter])
        const alternatives = useMemo(() => videoStarterAlternatives(scores), [scores])

        // Say plainly what the skeleton was built from, so nobody copies one
        // that is still half written on a form that wanted every row.
        const rowsScored = TASK.axes.filter((k) => k !== 'overall' && scores[k] !== undefined).length
        const builtFrom = !rowsScored
          ? 'From your overall pick only'
          : review.complete
            ? 'From all ' + TASK.axes.length + ' rows'
            : overallOnly
              ? 'From overall plus ' + rowsScored + ' of your own notes'
              : 'From overall plus ' + rowsScored + ' rows, ' + (TASK.axes.length - 1 - rowsScored) + ' still unscored'

        // Number keys score the next unfilled row, backspace undoes the last.
        useEffect(() => {
          const onKey = (e) => {
            if (e.metaKey || e.ctrlKey || e.altKey) return
            const tag = (e.target && e.target.tagName) || ''
            // The beat checklist has a text input, so the shortcuts have to stay
            // out of the way while someone is typing into it.
            if (tag === 'INPUT' || tag === 'TEXTAREA') return
            const idx = ['1', '2', '3', '4', '5', '6'].indexOf(e.key)
            if (idx !== -1) {
              const nextAxis = TASK.axes.find((k) => scores[k] === undefined)
              if (nextAxis) {
                const opts = optionsFor(nextAxis)
                if (idx < opts.length) setScore(nextAxis, opts[idx].value)
              }
              return
            }
            if (e.key === 'Backspace') {
              const lastFilled = TASK.axes.slice().reverse().find((k) => scores[k] !== undefined)
              if (lastFilled) setScore(lastFilled, undefined)
            }
          }
          window.addEventListener('keydown', onKey)
          return () => window.removeEventListener('keydown', onKey)
        }, [scores, setScore])

        return (
          <div className="min-h-screen bg-slate-950 text-slate-200 antialiased">
            <div className="mx-auto max-w-6xl px-4 py-8 sm:px-6 sm:py-12">
              <header className="mb-8 flex flex-wrap items-center justify-between gap-4">
                <div className="flex items-center gap-3">
                  <div className="flex h-10 w-10 items-center justify-center rounded-xl bg-indigo-500/15 text-lg">
                    &#127916;
                  </div>
                  <div>
                    <h1 className="text-lg font-semibold text-slate-50">Project Hedgehog</h1>
                    <p className="text-xs tracking-wide text-slate-500">Image to Video Calculator</p>
                  </div>
                </div>
                <div className="flex items-center gap-2">
                  <a
                    href="./index.html"
                    className="rounded-xl border border-slate-700 px-4 py-2 text-sm font-medium text-slate-300 transition hover:border-slate-500 hover:text-slate-100"
                  >
                    Image tasks
                  </a>
                  <a
                    href="./training.html"
                    className="rounded-xl border border-slate-700 px-4 py-2 text-sm font-medium text-slate-300 transition hover:border-slate-500 hover:text-slate-100"
                  >
                    Training
                  </a>
                </div>
              </header>

              <main className="grid items-start gap-6 lg:grid-cols-[minmax(0,1fr)_380px]">
                <div className="space-y-4">
                  <div className="rounded-2xl border border-indigo-500/30 bg-indigo-500/[0.07] p-5">
                    <h2 className="text-sm font-semibold text-indigo-200">Read this before you score</h2>
                    <p className="mt-2 text-sm leading-relaxed text-slate-300">
                      On the image tasks the calculator works out the overall for you from the rows. Video does not
                      work that way. Overall Preference is a gut call, you make it first, and it is not an average
                      or a count of the rows. So this page will never decide it for you.
                    </p>
                    <p className="mt-2 text-sm leading-relaxed text-slate-400">
                      You have ten minutes. Turn the sound on, read the prompt, then watch both clips right
                      through. Watching properly takes five to six minutes, which leaves about four to write. Go
                      one row at a time, watching again for each.
                    </p>

                    <label className="mt-4 flex cursor-pointer items-start gap-3 rounded-xl border border-slate-700/70 bg-slate-950/40 p-3">
                      <input
                        type="checkbox"
                        checked={overallOnly}
                        onChange={(e) => setOverallOnly(e.target.checked)}
                        className="mt-0.5 h-4 w-4 shrink-0 accent-indigo-500"
                      />
                      <span className="text-xs leading-relaxed text-slate-400">
                        <span className="font-semibold text-slate-200">This task only asks for Overall.</span> The
                        rows stay below either way, because they are still what you look at. Tick this and the page
                        stops counting them as missing, and treats anything you do mark as private notes to shape
                        your justification.
                      </span>
                    </label>
                  </div>

                  {overallOnly && (
                    <p className="rounded-xl border border-slate-800 bg-slate-900/50 p-3 text-xs leading-relaxed text-slate-400">
                      The form takes one score, but the justification is still marked on evidence. Score Overall,
                      then mark any row below that helped you decide. Each one you mark swaps a general question in
                      your justification for a specific one. Marking nothing is fine: you will get a shorter
                      skeleton that asks for one concrete moment, one fault in the video you picked, and one thing
                      the other video does better.
                    </p>
                  )}

                  <div className="flex items-baseline justify-between">
                    <h2 className="text-xl font-semibold text-slate-50">
                      {TASK.label} <span className="text-slate-500">&middot; {TASK.axes.length} rows</span>
                    </h2>
                    <span className="hidden text-xs text-slate-500 sm:block">
                      Keys <kbd className="rounded bg-slate-800 px-1.5 py-0.5">1</kbd> to{' '}
                      <kbd className="rounded bg-slate-800 px-1.5 py-0.5">5</kbd> to score,{' '}
                      <kbd className="rounded bg-slate-800 px-1.5 py-0.5">&#9003;</kbd> to undo
                    </span>
                  </div>

                  {TASK.axes.map((key, i) => (
                    <React.Fragment key={key}>
                      <AxisRow
                        index={i}
                        axis={AXES[key]}
                        value={scores[key]}
                        onChange={setScore}
                        beats={beats}
                        onBeats={setBeats}
                      />
                      {key === 'overall' && (
                        <p className="px-1 text-xs leading-relaxed text-slate-500">
                          Now the rows below. Each one asks its own question and is scored on its own evidence.
                          The most common mistake is letting a feeling about one row bleed into the others, so a
                          clip that looks more real picks up wins it did not earn. One thing you noticed can count
                          on two rows, but only if it really belongs on each.
                        </p>
                      )}
                    </React.Fragment>
                  ))}
                </div>

                <aside className="lg:sticky lg:top-8">
                  <ReviewCard review={review} overallOnly={overallOnly} />
                  {starter && (
                    <FeedbackStarter
                      text={starter}
                      cost={cost}
                      builtFrom={builtFrom}
                      alternatives={alternatives}
                      onReword={() => setSeed((s) => s + 1)}
                    />
                  )}
                  <button
                    onClick={restart}
                    className="mt-3 w-full rounded-xl border border-slate-800 px-4 py-2.5 text-sm font-medium text-slate-400 transition hover:border-slate-600 hover:text-slate-200"
                  >
                    Next pair, clear the scores
                  </button>
                </aside>
              </main>
            </div>
          </div>
        )
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />)
    </script>
  </body>
</html>
