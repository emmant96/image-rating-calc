<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Hedgehog Decision Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      // Babel's stock "react" preset now defaults to the automatic JSX runtime, which
      // emits `import ... from "react/jsx-runtime"`. That cannot run in a plain (non-module)
      // script, so JSX would silently never execute. Pin the classic runtime instead, which
      // compiles to React.createElement and works with the UMD global loaded above.
      Babel.registerPreset('react-classic', {
        presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]],
      })
    </script>
    <style>
      /* Hide the un-transpiled app until Babel has run, so no flash of raw text. */
      #root:empty::after {
        content: 'Loading...';
        display: block;
        padding: 3rem;
        text-align: center;
        color: #64748b;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
    </style>
  </head>
  <!-- Background lives on <body> so the dark theme covers the full viewport, not just the content. -->
  <body class="bg-slate-950">
    <div id="root"></div>

    <script type="text/babel" data-presets="react-classic">
      const { useCallback, useEffect, useMemo, useRef, useState } = React

      /* ================================================================
       * SCORING ENGINE
       * Kept free of React so it can be tested on its own.
       * ---8<--- SCORING START
       * ================================================================ */

      const AXES = {
        instruction: {
          key: 'instruction',
          title: 'Instruction Following',
          blurb:
            'Did the picture do what it was told to do? If the words asked for a red hat, is there a red hat? This one breaks ties, so read it carefully.',
        },
        personId: {
          key: 'personId',
          title: 'Person ID',
          blurb:
            'Does the person still look like the same person? Look at the face only. New clothes or a new pose is fine and does not count against it.',
        },
        refPreservation: {
          key: 'refPreservation',
          title: 'Reference Preservation',
          blurb:
            'Did everything you did NOT ask to change stay the same? Check the background, the small objects, and whether the picture zoomed in or moved on its own.',
        },
        visualQuality: {
          key: 'visualQuality',
          title: 'Visual Quality',
          blurb:
            'Does the whole picture just look good? It should not be blurry, too bright, too colorful, or washed out. Things should sit in nice spots.',
        },
        artifacts: {
          key: 'artifacts',
          title: 'AI Artifacts',
          blurb:
            'Look for small broken bits. Count the fingers. Check the hands and feet. Look for messy letters, or skin that looks like shiny plastic.',
        },
      }

      const TASKS = {
        r2i: {
          id: 'r2i',
          label: 'Reference-to-Image',
          short: 'R2I',
          tagline: 'You start with a real photo and change part of it. Keeping the face and the background right is what matters.',
          axes: ['instruction', 'personId', 'refPreservation', 'visualQuality', 'artifacts'],
        },
        i2i: {
          id: 'i2i',
          label: 'Image-to-Image',
          short: 'I2I',
          tagline: 'Someone asks for one thing in a photo to be changed. You check the change really happened, and that nothing else got touched.',
          // I2I shares the R2I rubric: the same six dimensions, and the same
          // rule for turning them into an overall call.
          axes: ['instruction', 'personId', 'refPreservation', 'visualQuality', 'artifacts'],
        },
        t2i: {
          id: 't2i',
          label: 'Text-to-Image',
          short: 'T2I',
          tagline: 'You start with only words. The whole picture is made from scratch, so following the words is what matters.',
          axes: ['instruction', 'visualQuality', 'artifacts'],
        },
        ti2t: {
          id: 'ti2t',
          label: 'Text and Image to Text',
          short: 'TI2T',
          tagline: 'Two written answers about the same picture. You rate each answer on its own, then say which you prefer.',
          // Rated per response rather than head to head, so this task uses the
          // issue scale below instead of the five point preference scale.
          mode: 'issues',
          axes: ['factuality', 'instruction', 'helpfulness', 'style'],
        },
      }

      /**
       * I2I asks the same questions as R2I but about an edit, so the axes are
       * explained differently even though the scoring is identical.
       */
      const TASK_BLURBS = {
        i2i: {
          instruction: 'Did the change they asked for actually happen? If they said "make the sky blue", is the sky blue now? Careful: a change that is too small to notice is just as wrong as no change at all.',
          personId: 'If there are people, do they still look like the same people? Only the face and body shape count. New clothes or a new pose is fine. If there are no people at all, choose N/A.',
          refPreservation: 'Everything they did NOT ask to change should look exactly the same as before. Check the background, the other objects, and the colours in the parts that were left alone.',
          visualQuality: 'Does the whole picture still look good? Not blurry, not too bright, not washed out. You are looking at the whole picture, not one small spot.',
          artifacts: 'Look for small broken bits the edit left behind. Count the fingers. Look for smudgy joins where the new part meets the old part, messy letters, or extra things nobody asked for.',
        },
      }

      /** The wording for an axis, using the task's own version when it has one. */
      const axisFor = (taskId, key) => {
        const override = TASK_BLURBS[taskId] && TASK_BLURBS[taskId][key]
        return override ? Object.assign({}, AXES[key], { blurb: override }) : AXES[key]
      }

      /** Dimensions for the issue style task. */
      const ISSUE_AXES = {
        factuality: {
          key: 'factuality',
          title: 'Factuality',
          blurb:
            'Is everything it says true, and does it match what is actually visible in the picture? Invented details and wrong facts belong here.',
        },
        instruction: {
          key: 'instruction',
          title: 'Instruction Following',
          blurb:
            'Did it do what the prompt asked, including any format the prompt named, such as a set number of lines? Staying on topic counts here too.',
        },
        helpfulness: {
          key: 'helpfulness',
          title: 'Helpfulness',
          blurb:
            'Does it actually answer what the person wanted? A reply can be true and still unhelpful if it dodges the real question.',
        },
        style: {
          key: 'style',
          title: 'Style and Format',
          blurb:
            'Is it well written and easy to read? Penalise needless repetition, padding, and speculation dressed up as fact.',
        },
      }

      /**
       * Each response is rated on its own, so these are penalties rather than
       * preferences: the higher the number, the worse that response did.
       */
      const ISSUE_OPTIONS = [
        { value: 0, label: 'No Issue' },
        { value: 1, label: 'Minor Issue' },
        { value: 2, label: 'Major Issue' },
      ]

      const ISSUE_WORD = { 0: 'no issue', 1: 'a minor issue', 2: 'a major issue' }

      const OPTIONS = [
        { value: 2, label: 'Strongly A', side: 'A' },
        { value: 1, label: 'Slightly A', side: 'A' },
        { value: 0, label: 'Tie', side: 'T' },
        { value: -1, label: 'Slightly B', side: 'B' },
        { value: -2, label: 'Strongly B', side: 'B' },
      ]

      /**
       * Not applicable, for an axis that cannot be judged on this pair at all.
       *
       * This is not a Tie. A Tie says the two responses performed the same on a
       * dimension that was there to be judged; N/A says the dimension does not
       * exist here, as when no person appears in the reference and there is no
       * identity to preserve. Keeping them apart matters because a Tie is worth
       * explaining in the justification and an N/A is not.
       */
      const NA = 'na'
      const NA_OPTION = { value: NA, label: 'N/A', side: 'N' }

      /** Axes that can be marked not applicable. */
      const NA_AXES = { personId: true }

      const optionsFor = (axisKey) =>
        NA_AXES[axisKey] ? OPTIONS.concat([NA_OPTION]) : OPTIONS

      const isScored = (v) => typeof v === 'number'

      const VERDICTS = {
        STRONG_A: { label: 'Strongly A', side: 'A' },
        SLIGHT_A: { label: 'Slightly A', side: 'A' },
        TIE: { label: 'Tie', side: 'T' },
        SLIGHT_B: { label: 'Slightly B', side: 'B' },
        STRONG_B: { label: 'Strongly B', side: 'B' },
      }

      /** Instruction Following is the absolute tie-breaker on a true dimension split. */
      function tieBreak(instructionScore) {
        if (instructionScore > 0)
          return {
            verdict: VERDICTS.SLIGHT_A,
            why: 'Both sides win the same number of axes, so Instruction Following decides. It favors A.',
          }
        if (instructionScore < 0)
          return {
            verdict: VERDICTS.SLIGHT_B,
            why: 'Both sides win the same number of axes, so Instruction Following decides. It favors B.',
          }
        return {
          verdict: VERDICTS.TIE,
          why: 'Both sides win the same number of axes and Instruction Following is a Tie, so neither side wins.',
        }
      }

      /**
       * Compute the overall preference for a task.
       * Returns null while any axis is still unscored.
       */
      function computeResult(taskId, scores) {
        const axisKeys = TASKS[taskId].axes
        const values = axisKeys.map((k) => scores[k])
        if (values.some((v) => v === undefined || v === null)) return null

        // An axis marked not applicable is excluded outright rather than
        // treated as a zero, so it cannot drag the net total or the axis count.
        const scored = values.filter(isScored)
        const winsA = scored.filter((v) => v > 0).length
        const winsB = scored.filter((v) => v < 0).length
        const net = scored.reduce((sum, v) => sum + v, 0)
        const base = { winsA, winsB, net }

        // Equal category wins means a true dimension split, so Instruction Following decides.
        if (winsA === winsB) return Object.assign({}, base, tieBreak(scores.instruction))

        const aWins = winsA > winsB
        const winner = aWins ? 'A' : 'B'
        const wins = aWins ? winsA : winsB
        const total = scored.length

        const strong =
          taskId === 'r2i' || taskId === 'i2i'
            ? // R2I and I2I share a rubric: magnitude comes from the combined
              // net point total reaching 3 or beyond.
              aWins
              ? net >= 3
              : net <= -3
            : // T2I: a clean sweep, or a 2-axis win carrying heavy net weight.
              wins === total || (wins >= 2 && Math.abs(net) >= 3)

        const verdict = aWins
          ? strong
            ? VERDICTS.STRONG_A
            : VERDICTS.SLIGHT_A
          : strong
            ? VERDICTS.STRONG_B
            : VERDICTS.SLIGHT_B

        const signed = net > 0 ? '+' + net : '' + net
        const why = strong
          ? winner + ' wins ' + wins + ' of ' + total + ' axes with a net score of ' + signed + '. That is a big lead.'
          : winner + ' wins ' + wins + ' of ' + total + ' axes with a net score of ' + signed + '. That is a small lead.'

        return Object.assign({}, base, { verdict, why })
      }

      /* ----------------------------------------------------------------
       * Open feedback starter
       *
       * Builds the opening lines of the written feedback from the scores.
       * The calculator knows which axes each side won, so it can state the
       * comparative claim, but it knows nothing about the images. It therefore
       * stops mid-sentence and hands off to the tasker, who supplies the
       * visual evidence. Target length is 150 to 200 characters.
       *
       * Correctness gates the wording: candidate sentences are built only from
       * claims the scores support, and length then picks among those. Length
       * must never be able to select a phrasing the scores contradict.
       * ---------------------------------------------------------------- */

      /* ----------------------------------------------------------------
       * Justification builder
       *
       * Produces a skeleton the rater completes, not a finished answer. The
       * calculator knows which side won each axis; it cannot see the images,
       * so every claim about what is actually in them is left as a bracket.
       * ---------------------------------------------------------------- */

      const AXIS_PHRASE = {
        instruction: 'instruction following',
        personId: 'person ID',
        refPreservation: 'reference preservation',
        visualQuality: 'visual quality',
        artifacts: 'AI artifacts',
      }

      const AXIS_ORDER = ['instruction', 'personId', 'refPreservation', 'visualQuality', 'artifacts']

      /** Alternative wordings, so seven people do not submit the same sentence. */
      const PHRASES = {
        verdictStrong: [
          'I strongly prefer Response {W}',
          'Response {W} is clearly stronger',
          'This is a strong preference for Response {W}',
          'Response {W} wins decisively',
        ],
        verdictSlight: [
          'I slightly prefer Response {W}',
          'Response {W} has a narrow edge',
          'On balance I lean towards Response {W}',
          'Response {W} is marginally stronger',
        ],
        verdictTie: [
          'Neither response is stronger overall',
          'This one is genuinely even',
          'I cannot separate the two responses',
        ],
        wins: [
          'On {axis}, {W} is stronger: [name the feature and what it does]',
          'On {axis}, {W} handles [name the feature] correctly, while {L} [name the failure]',
          '{W} leads on {axis} because [name the feature] is [describe it], whereas {L} [describe the difference]',
          'Looking at {axis}, {W} gets [name the feature] right and {L} does not: [describe it]',
        ],
        even: [
          '{Axis} is even: both responses [name the shared detail], so it does not separate them',
          'On {axis} the two are level, since both [name the shared detail], and this does not decide anything',
          'Neither response gains on {axis}: [name the shared detail] appears in both',
        ],
        // On an edit task the instruction axis is really two questions: did the
        // change happen at all, and was it done fully. Under-editing fails just
        // as hard as ignoring the instruction, so the brackets ask for both.
        winsEdit: [
          'On {axis}, {W} actually makes the requested change: [say what the edit was and what {W} did], while {L} [say whether it missed the edit or barely did it]',
          '{W} carries out the edit properly, [describe the change in {W}], whereas {L} [say what is missing or under-done]',
          'Looking at {axis}, the edit lands in {W}: [name the change], while in {L} [describe how far short it falls]',
        ],
        evenEdit: [
          'Both responses make the requested change: [say what the edit was and how each handled it], so {axis} does not separate them',
          'The edit happens in both, [describe what each did], so neither gains on {axis}',
        ],
        notApplicable: [
          '{Axis} does not apply here: [say why, for example no person appears in the reference]',
          '{Axis} is out of scope for this pair, since [say what the reference actually shows]',
          'There is no identity to preserve in this pair, so {axis} does not apply: [note what the images show instead]',
        ],
        tradeoffMixed: [
          'Trade-off: {L} is ahead on {loseList}, but [say why that matters less than what {W} wins on]',
          'Weighing it up: {L} does take {loseList}, though [explain why {W} still comes out ahead]',
          'The trade-off is that {W} gives up {loseList}, but [say why the axes it wins matter more here]',
        ],
        tradeoffSweep: [
          'Trade-off: every differentiating flaw sits on {L}\u2019s side, so {W} wins {strength}',
          'Trade-off: nothing separates them in {L}\u2019s favour, which is why this is {strength}',
          'Trade-off: {L} carries all the problems that distinguish the two, making this {strength}',
        ],
      }

      function pickPhrase(list, seed, offset) {
        return list[(Math.abs(seed + offset)) % list.length]
      }

      function fillPhrase(template, vars) {
        return template.replace(/\{(\w+)\}/g, (m, key) => (key in vars ? vars[key] : m))
      }

      const listOf = (items) =>
        items.length <= 1
          ? items[0] || ''
          : items.slice(0, -1).join(', ') + ' and ' + items[items.length - 1]

      const capitalise = (t) => t.charAt(0).toUpperCase() + t.slice(1)

      /**
       * Build the justification skeleton for a scored task.
       * Returns null while any axis is unscored.
       */
      function buildStarter(scores, result, seed, taskId) {
        if (!result) return null
        const s = seed || 0
        const W = result.verdict.side
        const L = W === 'A' ? 'B' : 'A'
        const strong = result.verdict.label.indexOf('Strongly') === 0
        const axes = AXIS_ORDER.filter((k) => scores[k] !== undefined)

        const lines = []

        // 1. The verdict, first, so the reader knows where this is going.
        if (W === 'T') {
          lines.push(pickPhrase(PHRASES.verdictTie, s, 0) + '.')
        } else {
          const pool = strong ? PHRASES.verdictStrong : PHRASES.verdictSlight
          lines.push(fillPhrase(pickPhrase(pool, s, 0), { W }) + '.')
        }

        // 2. One clause per axis, in the order the rubric lists them.
        axes.forEach((k, i) => {
          const v = scores[k]
          const axis = AXIS_PHRASE[k]
          if (v === NA) {
            // Not the same as a tie: there was nothing to judge, so the rater
            // is asked why rather than asked to describe a shared detail.
            lines.push(
              fillPhrase(pickPhrase(PHRASES.notApplicable, s, i + 1), {
                axis,
                Axis: capitalise(axis),
              }) + '.'
            )
          } else if (v === 0) {
            const editAxis = taskId === 'i2i' && k === 'instruction'
            lines.push(
              fillPhrase(pickPhrase(editAxis ? PHRASES.evenEdit : PHRASES.even, s, i + 1), {
                axis,
                Axis: capitalise(axis),
              }) + '.'
            )
          } else {
            const winner = v > 0 ? 'A' : 'B'
            const loser = v > 0 ? 'B' : 'A'
            const editAxis = taskId === 'i2i' && k === 'instruction'
            lines.push(
              fillPhrase(pickPhrase(editAxis ? PHRASES.winsEdit : PHRASES.wins, s, i + 1), {
                axis,
                Axis: capitalise(axis),
                W: winner,
                L: loser,
              }) + '.'
            )
          }
        })

        // 3. The trade off, which is the part reviewers say is most often missing.
        if (W !== 'T') {
          const lost = axes.filter((k) => (W === 'A' ? scores[k] < 0 : scores[k] > 0)).map((k) => AXIS_PHRASE[k])
          const strength = strong ? 'strongly' : 'only slightly'
          if (lost.length) {
            lines.push(
              fillPhrase(pickPhrase(PHRASES.tradeoffMixed, s, 9), {
                W,
                L,
                loseList: listOf(lost),
                strength,
              }) + '.'
            )
          } else {
            lines.push(
              fillPhrase(pickPhrase(PHRASES.tradeoffSweep, s, 9), { W, L, strength }) + '.'
            )
          }
        } else {
          lines.push(
            'Trade-off: [say what you compared and why it came out even, rather than leaving it unexplained].'
          )
        }

        return lines.join(' ')
      }

      /** Every wording available for a slot, so the rater can swap any sentence. */
      function starterAlternatives(scores, result, taskId) {
        if (!result) return []
        const W = result.verdict.side
        const L = W === 'A' ? 'B' : 'A'
        const strong = result.verdict.label.indexOf('Strongly') === 0
        const out = []

        const verdictPool =
          W === 'T' ? PHRASES.verdictTie : strong ? PHRASES.verdictStrong : PHRASES.verdictSlight
        out.push({
          slot: 'Opening',
          options: verdictPool.map((t) => fillPhrase(t, { W })),
        })

        out.push({
          slot: 'An axis one side wins',
          options: PHRASES.wins.map((t) =>
            fillPhrase(t, { axis: 'visual quality', Axis: 'Visual quality', W, L })
          ),
        })

        if (taskId === 'i2i') {
          out.push({
            slot: 'Saying whether the edit happened',
            options: PHRASES.winsEdit.map((t) =>
              fillPhrase(t, { axis: 'instruction following', Axis: 'Instruction following', W, L })
            ),
          })
        }

        out.push({
          slot: 'An axis that is even',
          options: PHRASES.even.map((t) =>
            fillPhrase(t, { axis: 'reference preservation', Axis: 'Reference preservation' })
          ),
        })

        if (AXIS_ORDER.some((k) => scores[k] === NA)) {
          out.push({
            slot: 'An axis that does not apply',
            options: PHRASES.notApplicable.map((t) =>
              fillPhrase(t, { axis: 'person ID', Axis: 'Person ID' })
            ),
          })
        }

        const lost = AXIS_ORDER.filter(
          (k) => scores[k] !== undefined && (W === 'A' ? scores[k] < 0 : scores[k] > 0)
        ).map((k) => AXIS_PHRASE[k])
        const pool = lost.length ? PHRASES.tradeoffMixed : PHRASES.tradeoffSweep
        out.push({
          slot: 'Trade-off',
          options: pool.map((t) =>
            fillPhrase(t, {
              W,
              L,
              loseList: listOf(lost.length ? lost : ['that axis']),
              strength: strong ? 'strongly' : 'only slightly',
            })
          ),
        })

        return out
      }

      /* ----------------------------------------------------------------
       * Issue style scoring, for the text answer task
       *
       * Each response carries its own penalty per dimension: no issue 0, minor
       * 1, major 2. The gap on a dimension is B minus A, so a positive number
       * favours A.
       *
       * The published guidelines for this task do not state how the dimension
       * ratings combine into an overall preference, so this is a suggestion
       * rather than a rule. It leads on the summed gap, because severity is the
       * whole point of a three level scale, and reports the dimension count
       * beside it so the rater can disagree on sight.
       * ---------------------------------------------------------------- */

      const ISSUE_AXIS_ORDER = ['factuality', 'instruction', 'helpfulness', 'style']

      function issueGaps(scores) {
        return ISSUE_AXIS_ORDER.map((k) => {
          const v = scores[k]
          if (!v || !isScored(v.a) || !isScored(v.b)) return null
          return { key: k, a: v.a, b: v.b, gap: v.b - v.a }
        })
      }

      /** Returns null until both responses are rated on every dimension. */
      function computeIssueResult(scores) {
        const gaps = issueGaps(scores)
        if (gaps.some((g) => g === null)) return null

        const total = gaps.reduce((n, g) => n + g.gap, 0)
        const winsA = gaps.filter((g) => g.gap > 0).length
        const winsB = gaps.filter((g) => g.gap < 0).length
        const base = { winsA, winsB, net: total, gaps }

        if (total === 0) {
          const why =
            winsA === 0 && winsB === 0
              ? 'Both responses were rated the same on every dimension, so nothing separates them.'
              : 'A leads on ' + winsA + ' dimension(s) and B on ' + winsB +
                ', and the severity cancels out exactly, so it comes out even.'
          return Object.assign({}, base, { verdict: VERDICTS.TIE, why })
        }

        const aWins = total > 0
        const W = aWins ? 'A' : 'B'
        const strong = Math.abs(total) >= 3
        const verdict = aWins
          ? strong
            ? VERDICTS.STRONG_A
            : VERDICTS.SLIGHT_A
          : strong
            ? VERDICTS.STRONG_B
            : VERDICTS.SLIGHT_B

        const why =
          W + ' carries ' + Math.abs(total) + ' fewer issue point(s) across the four dimensions, ' +
          'leading on ' + (aWins ? winsA : winsB) + ' of them. ' +
          (strong ? 'That is a wide gap.' : 'That is a narrow gap.')

        return Object.assign({}, base, { verdict, why })
      }

      const ISSUE_PHRASES = {
        oneSided: [
          'On {axis}, Response {W} has {wLevel} while Response {L} has {lLevel}: [name what {L} gets wrong]',
          '{Axis} favours Response {W}, which has {wLevel} against {lLevel} for {L}, because [name the problem in {L}]',
          'Looking at {axis}, {L} has {lLevel} where {W} has {wLevel}: [say exactly what the problem is]',
        ],
        sharedClean: [
          'On {axis}, neither response has an issue: [note what both get right], so this does not separate them',
          'Both responses handle {axis} cleanly, since [note what both get right], and it does not decide anything',
        ],
        sharedFault: [
          'On {axis}, both responses have {level}: [name what each gets wrong], so this does not separate them',
          'Both sides share {level} on {axis}, since [name the shared problem], and it cancels out',
        ],
      }

      /** The justification skeleton for the text answer task. */
      function buildIssueStarter(scores, result, seed) {
        if (!result) return null
        const s = seed || 0
        const W = result.verdict.side
        const L = W === 'A' ? 'B' : 'A'
        const strong = result.verdict.label.indexOf('Strongly') === 0
        const lines = []

        if (W === 'T') {
          lines.push(pickPhrase(PHRASES.verdictTie, s, 0) + '.')
        } else {
          const pool = strong ? PHRASES.verdictStrong : PHRASES.verdictSlight
          lines.push(fillPhrase(pickPhrase(pool, s, 0), { W }) + '.')
        }

        result.gaps.forEach((g, i) => {
          const axis = ISSUE_AXES[g.key].title.toLowerCase()
          const Axis = ISSUE_AXES[g.key].title
          if (g.gap === 0) {
            const pool = g.a === 0 ? ISSUE_PHRASES.sharedClean : ISSUE_PHRASES.sharedFault
            lines.push(
              fillPhrase(pickPhrase(pool, s, i + 1), { axis, Axis, level: ISSUE_WORD[g.a] }) + '.'
            )
          } else {
            const winner = g.gap > 0 ? 'A' : 'B'
            const loser = g.gap > 0 ? 'B' : 'A'
            lines.push(
              fillPhrase(pickPhrase(ISSUE_PHRASES.oneSided, s, i + 1), {
                axis,
                Axis,
                W: winner,
                L: loser,
                wLevel: ISSUE_WORD[winner === 'A' ? g.a : g.b],
                lLevel: ISSUE_WORD[loser === 'A' ? g.a : g.b],
              }) + '.'
            )
          }
        })

        if (W === 'T') {
          lines.push(
            'Trade-off: [say what you compared and why it came out even, rather than leaving it unexplained].'
          )
        } else {
          const lost = result.gaps
            .filter((g) => (W === 'A' ? g.gap < 0 : g.gap > 0))
            .map((g) => ISSUE_AXES[g.key].title.toLowerCase())
          const strength = strong ? 'strongly' : 'only slightly'
          if (lost.length) {
            lines.push(
              fillPhrase(pickPhrase(PHRASES.tradeoffMixed, s, 9), {
                W,
                L,
                loseList: listOf(lost),
                strength,
              }) + '.'
            )
          } else {
            lines.push(fillPhrase(pickPhrase(PHRASES.tradeoffSweep, s, 9), { W, L, strength }) + '.')
          }
        }

        return lines.join(' ')
      }

      function issueAlternatives(scores, result) {
        if (!result) return []
        const W = result.verdict.side
        const L = W === 'A' ? 'B' : 'A'
        const strong = result.verdict.label.indexOf('Strongly') === 0
        const out = []

        out.push({
          slot: 'Opening',
          options: (W === 'T'
            ? PHRASES.verdictTie
            : strong
              ? PHRASES.verdictStrong
              : PHRASES.verdictSlight
          ).map((t) => fillPhrase(t, { W })),
        })
        out.push({
          slot: 'A dimension one side wins',
          options: ISSUE_PHRASES.oneSided.map((t) =>
            fillPhrase(t, {
              axis: 'factuality',
              Axis: 'Factuality',
              W: W === 'T' ? 'A' : W,
              L: W === 'T' ? 'B' : L,
              wLevel: 'no issue',
              lLevel: 'a minor issue',
            })
          ),
        })
        out.push({
          slot: 'A dimension where both share a fault',
          options: ISSUE_PHRASES.sharedFault.map((t) =>
            fillPhrase(t, {
              axis: 'instruction following',
              Axis: 'Instruction following',
              level: 'a minor issue',
            })
          ),
        })
        const lost = result.gaps
          .filter((g) => (W === 'A' ? g.gap < 0 : g.gap > 0))
          .map((g) => ISSUE_AXES[g.key].title.toLowerCase())
        out.push({
          slot: 'Trade-off',
          options: (lost.length ? PHRASES.tradeoffMixed : PHRASES.tradeoffSweep).map((t) =>
            fillPhrase(t, {
              W: W === 'T' ? 'A' : W,
              L: W === 'T' ? 'B' : L,
              loseList: listOf(lost.length ? lost : ['that dimension']),
              strength: strong ? 'strongly' : 'only slightly',
            })
          ),
        })
        return out
      }

      /* ---8<--- SCORING END */

      /* ================================================================
       * Presentation helpers
       * ================================================================ */

      const SIDE_THEME = {
        A: {
          card: 'bg-emerald-500/10 border-emerald-400/40 ring-emerald-400/20',
          chip: 'bg-emerald-500 text-emerald-950',
          pill: 'bg-emerald-500 text-emerald-950 shadow-emerald-500/30',

        B: {

          pill: 'bg-amber-500 text-amber-950 shadow-amber-500/30',
        },
        T: {
          card: 'bg-slate-500/10 border-slate-400/40 ring-slate-400/20',
          chip: 'bg-slate-400 text-slate-950',
          pill: 'bg-slate-300 text-slate-900 shadow-slate-400/30',
        },
        // Not applicable is deliberately understated. It is not a judgement, so
        // it should not look like one sitting beside the four that are.
        N: {
          card: 'bg-slate-500/10 border-slate-400/40 ring-slate-400/20',
          chip: 'bg-slate-600 text-slate-100',
          pill: 'bg-slate-600 text-slate-100 shadow-slate-700/30',

      const cx = (...c) => c.filter(Boolean).join(' ')

      /* ================================================================
       * Screens

      function TaskCard({ task, onSelect }) {

      function AxisRow({ axis, index, value, onChange }) {

                {index + 1}
              </span>

                <h3 className="text-base font-semibold text-slate-100 sm:text-lg">{axis.title}</h3>
                <p className="mt-1.5 text-sm leading-relaxed text-slate-400">{axis.blurb}</p>
              </div>
            </div>

            <div

              aria-label={axis.title}

                'mt-5 grid grid-cols-2 gap-2',
                optionsFor(axis.key).length > 5 ? 'sm:grid-cols-6' : 'sm:grid-cols-5'
              )}

              {optionsFor(axis.key).map((opt) => {

                      opt.value === 0 && 'col-span-2 sm:col-span-1',

      /**
       * One dimension of the text answer task. Both responses are rated here,
       * because this task asks how each one did rather than which one won.
       */
      function IssueRow({ axis, index, value, onChange }) {
        const v = value || {}
        const gap = isScored(v.a) && isScored(v.b) ? v.b - v.a : null

        const side = (which) => (
          <div className="flex-1">
            <div className="mb-2 text-xs font-bold uppercase tracking-wider text-slate-500">

                return (

                    key={opt.value}
                    role="radio"
                    aria-checked={active}
                    onClick={() => onChange(axis.key, which, active ? undefined : opt.value)}

        return (
          <section className="rounded-2xl border border-slate-800 bg-slate-900/50 p-5 transition hover:border-slate-700 sm:p-6">
            <div className="flex items-start gap-3">
              <span className="mt-0.5 flex h-6 w-6 shrink-0 items-center justify-center rounded-md bg-slate-800 text-xs font-bold text-slate-400">

      function ResultCard({ result, filled, total }) {

                    </dd>

              </React.Fragment>
            ) : (
              <React.Fragment>
                <div className="mt-4 h-2 w-full overflow-hidden rounded-full bg-slate-800">
                  <div
                    className="h-full rounded-full bg-indigo-500 transition-all duration-300"
                    style={{ width: (filled / total) * 100 + '%' }}
                  />
                </div>
                <p className="mt-4 text-sm leading-relaxed text-slate-400">
                  Please score all axes to calculate overall preference.

      }

      function FeedbackStarter({ text, alternatives, onReword }) {
        const [showBank, setShowBank] = useState(false)
        // 'idle' | 'copied' | 'manual'. 'manual' means both copy paths were
        // refused, so the text is selected and the user finishes with Ctrl+C.
        const [status, setStatus] = useState('idle')
        const textRef = useRef(null)

        // Reset whenever the scores change the text underneath the button.
        useEffect(() => setStatus('idle'), [text])

        const words = text.trim().split(/\s+/).length

        /** Legacy path: works without clipboard permission, needs a live selection. */
        const copyViaTextarea = () => {
          const ta = document.createElement('textarea')
          ta.value = text
          ta.setAttribute('readonly', '')
          ta.style.position = 'fixed'
          ta.style.top = '0'
          ta.style.opacity = '0'
          document.body.appendChild(ta)
          ta.select()
          let ok = false
          try {
            ok = document.execCommand('copy')
          } catch (err) {
            ok = false
          }
          document.body.removeChild(ta)
          return ok
        }

        /** Last resort: select the visible text so Ctrl+C works by hand. */
        const selectVisibleText = () => {
          if (!textRef.current) return
          const range = document.createRange()
          range.selectNodeContents(textRef.current)
          const sel = window.getSelection()
          sel.removeAllRanges()
          sel.addRange(range)
        }

        const copy = async () => {
          // The async clipboard API is refused when the document is not focused
          // or the permission is denied, so every path below has a fallback and
          // the failure is always visible rather than a button that does nothing.
          try {
            if (navigator.clipboard && window.isSecureContext) {
              await navigator.clipboard.writeText(text)
              setStatus('copied')
              setTimeout(() => setStatus('idle'), 2000)
              return
            }
          } catch (err) {
            // Fall through to the legacy path below.
          }

          if (copyViaTextarea()) {
            setStatus('copied')
            setTimeout(() => setStatus('idle'), 2000)
            return
          }

          selectVisibleText()
          setStatus('manual')
        }

        const copied = status === 'copied'

        return (
          <div className="mt-3 rounded-2xl border border-slate-800 bg-slate-900/50 p-5">
            <div className="flex items-center justify-between gap-3">
              <h3 className="text-xs font-bold uppercase tracking-[0.18em] text-slate-400">
                Justification skeleton
              </h3>
              <span
                className={cx(
                  'rounded-md px-2 py-1 text-xs font-semibold',
                  words >= 20 && text.length >= 100
                    ? 'bg-slate-800/80 text-slate-400'
                    : 'bg-rose-500/20 text-rose-300'
                )}
                title="Answers under 20 words are rejected, and this task needs at least 100 characters"
              >
                {words} words &middot; {text.length} chars
              </span>
            </div>

            <p
              ref={textRef}
              className="mt-3 max-h-72 overflow-y-auto rounded-xl bg-slate-950/60 p-3 text-sm leading-relaxed text-slate-300 selection:bg-indigo-500/40"
            >
              {text}
            </p>

            <button
              onClick={copy}
              className={cx(
                'mt-3 w-full rounded-xl px-4 py-2.5 text-sm font-semibold transition focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400',
                copied
                  ? 'bg-emerald-500 text-emerald-950'
                  : status === 'manual'
                    ? 'bg-amber-500 text-amber-950'
                    : 'bg-indigo-500 text-white hover:bg-indigo-400'
              )}
            >
              {copied ? 'Copied' : status === 'manual' ? 'Selected, press Ctrl+C' : 'Copy skeleton'}
            </button>

            <button
              onClick={onReword}
              className="mt-2 w-full rounded-xl border border-slate-800 px-4 py-2 text-xs font-medium text-slate-400 transition hover:border-slate-600 hover:text-slate-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400"
            >
              Reword it
            </button>

            <p className="mt-2.5 text-xs leading-relaxed text-slate-500">
              Replace every [bracket] with the person and the feature you actually saw,
              such as "ref 3's glasses turn solid white in B", never "B looks better".
              The trade-off sentence is the part reviewers most often find missing.
            </p>

            {alternatives && alternatives.length > 0 && (
              <div className="mt-3 border-t border-slate-800 pt-3">
                <button
                  onClick={() => setShowBank((v) => !v)}
                  className="flex w-full items-center justify-between text-xs font-semibold text-slate-400 transition hover:text-slate-200"
                >
                  <span>Other ways to say it</span>
                  <span>{showBank ? 'hide' : 'show'}</span>
                </button>
                {showBank && (
                  <div className="mt-3 space-y-3">
                    {alternatives.map((group) => (
                      <div key={group.slot}>
                        <div className="text-[11px] font-bold uppercase tracking-wider text-slate-500">
                          {group.slot}
                        </div>
                        <ul className="mt-1 space-y-1">
                          {group.options.map((opt, i) => (
                            <li
                              key={i}
                              className="rounded-lg bg-slate-950/50 px-2.5 py-1.5 text-xs leading-relaxed text-slate-400"
                            >
                              {opt}
                            </li>
                          ))}
                        </ul>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </div>
        )
      }

      /* ================================================================
       * App
       * ================================================================ */

      function App() {
        const [taskId, setTaskId] = useState(null)
        const [scores, setScores] = useState({})

        const task = taskId ? TASKS[taskId] : null

        /**
         * Set one side of an issue rating, merging against the latest state
         * rather than the value this row rendered with. Rating A and then B in
         * quick succession would otherwise drop the first of the two.
         */
        const setIssue = useCallback((axisKey, which, value) => {
          setScores((prev) => {
            const merged = Object.assign({}, prev[axisKey], { [which]: value })
            if (merged.a === undefined && merged.b === undefined) {
              const next = Object.assign({}, prev)
              delete next[axisKey]
              return next
            }
            return Object.assign({}, prev, { [axisKey]: merged })
          })
        }, [])

        const setScore = useCallback((axisKey, value) => {
          setScores((prev) => {
            const next = Object.assign({}, prev)
            if (value === undefined) delete next[axisKey]
            else next[axisKey] = value
            return next
          })
        }, [])

        const reset = () => {
          setTaskId(null)
          setScores({})
        }

        const issueMode = !!(task && task.mode === 'issues')
        const filled = !task
          ? 0
          : issueMode
            ? task.axes.filter((k) => scores[k] && isScored(scores[k].a) && isScored(scores[k].b)).length
            : task.axes.filter((k) => scores[k] !== undefined).length
        const result = useMemo(
          () => (!task ? null : issueMode ? computeIssueResult(scores) : computeResult(task.id, scores)),
          [task, issueMode, scores]
        )
        // Random at page load, so two taskers on the same scores do not open
        // with the same sentence. Reshuffle bumps it on demand.
        const [seed, setSeed] = useState(() => Math.floor(Math.random() * 1e9))
        const starter = useMemo(
          () => (issueMode ? buildIssueStarter(scores, result, seed) : buildStarter(scores, result, seed, taskId)),
          [issueMode, scores, result, seed]
        )
        const alternatives = useMemo(
          () => (issueMode ? issueAlternatives(scores, result) : starterAlternatives(scores, result, taskId)),
          [issueMode, scores, result]
        )

        // Keyboard shortcuts: 1 to 5 scores the next unfilled axis, Backspace undoes the last one.
        useEffect(() => {
          // The number keys pick one option per row, which does not fit a task
          // that asks for two ratings per row, so they are disabled there.
          if (!task || task.mode === 'issues') return
          const onKey = (e) => {
            if (e.metaKey || e.ctrlKey || e.altKey) return
            const idx = ['1', '2', '3', '4', '5', '6'].indexOf(e.key)
            if (idx !== -1) {
              const nextAxis = task.axes.find((k) => scores[k] === undefined)
              // 6 only exists on an axis that offers N/A, so elsewhere it is
              // ignored rather than selecting nothing.
              if (nextAxis) {
                const opts = optionsFor(nextAxis)
                if (idx < opts.length) setScore(nextAxis, opts[idx].value)
              }
              return
            }
            if (e.key === 'Backspace') {
              const lastFilled = task.axes.slice().reverse().find((k) => scores[k] !== undefined)
              if (lastFilled) setScore(lastFilled, undefined)
            }
          }
          window.addEventListener('keydown', onKey)
          return () => window.removeEventListener('keydown', onKey)
        }, [task, scores, setScore])

        return (
          <div className="min-h-screen bg-slate-950 text-slate-200 antialiased">
            <div className="mx-auto max-w-6xl px-4 py-8 sm:px-6 sm:py-12">
              <header className="mb-8 flex flex-wrap items-center justify-between gap-4">
                <div className="flex items-center gap-3">
                  <div className="flex h-10 w-10 items-center justify-center rounded-xl bg-indigo-500/15 text-lg">
                    &#129428;
                  </div>
                  <div>
                    <h1 className="text-lg font-semibold text-slate-50">Project Hedgehog</h1>
                    <p className="text-xs tracking-wide text-slate-500">Decision Calculator</p>
                  </div>
                </div>
                <div className="flex items-center gap-2">
                <a
                  href="./training.html"
                  className="rounded-xl border border-slate-700 px-4 py-2 text-sm font-medium text-slate-300 transition hover:border-slate-500 hover:text-slate-100"
                >
                  Training
                </a>
                {task && (
                  <button
                    onClick={reset}
                    className="rounded-xl border border-slate-700 px-4 py-2 text-sm font-medium text-slate-300 transition hover:border-slate-500 hover:text-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400"
                  >
                    &larr; Back to Task Selection
                  </button>
                )}
                </div>
              </header>

              {!task ? (
                <main className="mx-auto max-w-3xl">
                  <h2 className="text-center text-2xl font-semibold text-slate-50 sm:text-3xl">
                    Which task type are you evaluating?
                  </h2>
                  <p className="mt-3 text-center text-sm text-slate-400">
                    Pick a task to load its scoring axes. Side A vs Side B, scored one axis at a time.
                  </p>
                  <div className="mt-8 grid gap-5 sm:grid-cols-2">
                    {Object.keys(TASKS).map((id) => (
                      <TaskCard key={id} task={TASKS[id]} onSelect={setTaskId} />
                    ))}
                  </div>
                </main>
              ) : (
                <main className="grid items-start gap-6 lg:grid-cols-[minmax(0,1fr)_360px]">
                  <div className="space-y-4">
                    <div className="flex items-baseline justify-between">
                      <h2 className="text-xl font-semibold text-slate-50">
                        {task.label}{' '}
                        <span className="text-slate-500">
                          &middot; {task.axes.length} {issueMode ? 'dimensions' : 'axes'}
                        </span>
                      </h2>
                      {!issueMode && (
                        <span className="hidden text-xs text-slate-500 sm:block">
                          Keys <kbd className="rounded bg-slate-800 px-1.5 py-0.5">1</kbd> to{' '}
                          <kbd className="rounded bg-slate-800 px-1.5 py-0.5">5</kbd> to score,{' '}
                          <kbd className="rounded bg-slate-800 px-1.5 py-0.5">&#9003;</kbd> to undo
                        </span>
                      )}
                    </div>

                    {task.axes.map((key, i) =>
                      issueMode ? (
                        <IssueRow key={key} index={i} axis={ISSUE_AXES[key]} value={scores[key]} onChange={setIssue} />
                      ) : (
                        <AxisRow
                          key={key}
                          index={i}
                          axis={axisFor(task.id, key)}
                          value={scores[key]}
                          onChange={setScore}
                        />
                      )
                    )}
                  </div>

                  <aside className="lg:sticky lg:top-8">
                    <ResultCard result={result} filled={filled} total={task.axes.length} />
                    {starter && (
                      <FeedbackStarter
                        text={starter}
                        alternatives={alternatives}
                        onReword={() => setSeed((s) => s + 1)}
                      />
                    )}
                    <button
                      onClick={() => setScores({})}
                      className="mt-3 w-full rounded-xl border border-slate-800 px-4 py-2.5 text-sm font-medium text-slate-400 transition hover:border-slate-600 hover:text-slate-200"
                    >
                      Clear scores
                    </button>
                  </aside>
                </main>
              )}
            </div>
          </div>
        )
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />)
    </script>
  </body>
</html>
